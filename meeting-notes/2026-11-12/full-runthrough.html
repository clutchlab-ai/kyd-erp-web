<noscript><h1>ERP 完整操作會議逐字稿</h1><section><h2>開會前，手機與電腦先各自準備好</h2><p>電腦分享 ERP；手機讀講稿</p></section><section><h2>開場：先讓大家知道今天會看到什麼</h2><p>人資專員</p><p><strong>我說：</strong>各位主管好，我是 IAN。今天我會把 ERP 的方向再完整說明一次，也把上次會議到現在的調整一起帶過。前一次沒有參加的主管，也可以從今天這一輪看懂整套系統怎麼用。</p><p><strong>我說：</strong>今天我不會一頁一頁念功能名稱。我們用幾件平常會發生的事來走：有人請假、要找人代班、文件快到期、工作做完要交主管確認。我會切換不同角色，讓大家看到事情怎麼從一個人交到下一個人。</p><p><strong>我說：</strong>上次大家很重視一件事，就是像證件與合約那樣，一打開就看得出整體狀況。所以這次的調整，也把這個做法帶到人事、考勤、排班和管理看板：先看哪裡需要處理，再點進去看原因。</p><p><strong>我說：</strong>今天示範用的是會議互動版。原本員工和公司的真實資料保留，操作流程另外用示例資料。大家可以直接看使用方式，再告訴我哪些地方跟實際工作不一樣。</p></section><section><h2>先講這段時間改了哪些重點</h2><p>人資專員</p><p><strong>我說：</strong>從上次會議到現在，第一個重點是總表。人資和主管除了自己的待辦，也能看授權範圍內所有人的狀況，包括證件、假勤、工時和年假。沒有資料的人也列出來，才不會漏掉。</p><p><strong>我說：</strong>第二個是請假和排班接起來。假單核准後，總表、餘額和班表可以對照；班表改成月曆看，也會指出請假衝突、還沒有發布的班次和需要補人的地方。</p><p><strong>我說：</strong>第三個是每一個角色真的能接著做。這幾天又檢查了退回、重送、複核、核准和生效，補掉重複請假、找錯審核人，以及核准後要改日期卻沒入口的問題。</p><p><strong>我說：</strong>第四個是管理層先看重點。董事長看到的是公司的狀況、部門近況和需要注意的事情；主管再往下看自己負責的工作。工程、採購、薪資和其他原有模組也保留，今天會一起帶過。</p></section><section><h2>先看員工：自己的工作放在一起</h2><p>員工 · 林小安</p><p><strong>操作：</strong>上方「流程示範角色」選「員工 · 林小安」→「工作首頁」。</p><p><strong>我說：</strong>假設我是員工，昨天送了一張假單，今天最想知道的就是過了沒有、還是要補什麼。從自己的首頁就能找，不用再去翻聊天紀錄，問人資有沒有收到。</p><p><strong>應該看到：</strong>首頁顯示這個角色的待辦、本人申請與可用入口。</p><p><strong>操作：</strong>開「我的申請」查看不同種類及狀態，再開「申請與簽核」。</p><p><strong>我說：</strong>這裡的「我的申請」，是看我自己送出去的東西；「申請與簽核」，是看現在輪到我處理的事情。兩者分開，就比較不會把自己的進度和別人交給我的工作混在一起。</p><p><strong>應該看到：</strong>同一筆單據能從對應清單進入，角色切換不會另建一張。</p><p><strong>操作：</strong>稍後切管理層時，指一下「我的工作與申請」入口。</p><p><strong>我說：</strong>主管和董事長也一樣有自己的個人工作入口。管理職務多了管理和簽核，不代表他們就沒有請假、自己的通知或個人的申請。</p></section><section><h2>員工與組織：任職公司和支援工作分開</h2><p>人資專員</p><p><strong>操作：</strong>切「人資專員」→「員工與組織」。只有已登入且名冊載入成功，才展示真實清單；否則先說明入口，不把示例當真實名冊。</p><p><strong>我說：</strong>這裡沿用原本提供的員工資料，先把員工在哪家公司、哪個部門、什麼職務列清楚。同一批人可以支援不同項目，但不代表任職公司或發薪公司會跟著換。</p><p><strong>操作：</strong>查看公司篩選、員工資料，再切「公司與部門組織」。只開展示必要欄位，避開未授權的薪資與證件內容。</p><p><strong>我說：</strong>像 KY iCenter 和 Golden One，工作可能由同一批人協作，但管理公司和出帳公司仍要分開。之後一筆申請或費用屬於哪家公司，也要能查清楚。</p><p><strong>我說：</strong>這裡的目的是先把資料歸屬弄清楚。真的要調動任職或職務，會走後面的人事異動流程，不是換一個篩選就把員工換公司。</p></section><section><h2>人資和主管：先看完整狀況，再處理問題</h2><p>人資專員 → 人資主管 → 工程主管</p><p><strong>操作：</strong>人資專員進「工作首頁／人事管理總覽」，選月份、部門或搜尋人員，按「套用篩選」。</p><p><strong>我說：</strong>這是這次比較重要的改進。上次提到證件與合約看起來清楚，我們就把同樣的方式用在人事總覽：先把人列齊，再把需要處理的事情標出來。</p><p><strong>應該看到：</strong>有待查、待核對、已核對等狀態；未登錄資料的人仍出現在總表。</p><p><strong>操作：</strong>點一位員工的「核對資料」，查看各項來源；再返回總覽。</p><p><strong>我說：</strong>例如月底有人問：哪些人的證件還沒補、誰的打卡需要核對？人資可以先從這張表找，不用先打開每個人的資料才知道有沒有問題。需要處理哪一筆，再點進去看。</p><p><strong>應該看到：</strong>返回後可保留原月份和篩選，來源有變動時會提醒重新核對。</p><p><strong>操作：</strong>展示核對狀態與說明入口；若保存，填「會議示範：已查看來源，後續待補資料」。</p><p><strong>我說：</strong>如果需要，人資也可以留下核對說明。但在這裡寫已核對，不會把過期證件變有效，也不會代替主管簽核。</p><p><strong>操作：</strong>切「工程主管 · 周以辰」→「工作首頁」，對照名單範圍；再切回人資專員。</p><p><strong>我說：</strong>我再切到工程主管。這時看的是自己負責的部門，並不是所有人的資料都開放。看得到哪些人，跟能不能修改、複核或核准，會分開管理。</p><p><strong>請確認：</strong>這樣先看整體、再查明細的方式，是否符合人資和主管平常的管理習慣？哪些欄位還需要放在第一眼就能看到的位置？</p></section><section><h2>證件與合約：看得到到期，也追得到處理進度</h2><p>人資專員 → 員工 → 人資專員</p><p><strong>操作：</strong>人資進「證件與合約」，選「功能操作示範」資料來源，再進「全員證件總表」。先展示整張表，再點林小安的工作許可。</p><p><strong>我說：</strong>證件與合約仍保留大家覺得清楚的做法。這張表把勞動合約、護照、工作許可、簽證等放在一起，正常、快到期、已到期或還沒登錄，都能分開看。</p><p><strong>應該看到：</strong>點狀態能開同一人的證件明細。未登錄表示待核對，不直接等於不適用或違規。</p><p><strong>操作：</strong>點林小安已到期的「工作許可」狀態，在明細把「跟進狀態」選「續辦中」，填「處理內容」與「下次跟進日期」→「記錄跟進」。先不填新到期日。</p><p><strong>我說：</strong>以前看到證件快到期，可能先傳一則訊息提醒，但過幾天就忘了對方有沒有處理。這裡可以記下已經提醒、正在續辦，還有哪一天要再追。換一位同事接手，也知道前面做到哪裡。</p><p><strong>應該看到：</strong>新跟進紀錄出現；證件仍到期，不會因為寫續辦中就變有效。</p><p><strong>操作：</strong>切員工→右上角鈴鐺→自己的證件提醒→開明細；再展示已讀狀態。</p><p><strong>我說：</strong>本人也需要知道這件事。我現在切回員工，從右上角通知就能看到自己的提醒，點下去會回到該筆資料。</p><p><strong>應該看到：</strong>員工看到自己的提醒，人資仍可查看授權範圍內的整體狀況。</p><p><strong>操作：</strong>切回人資，開剛才的證件明細：跟進狀態選「已收到新證件」，填處理內容、下次跟進日期及「新到期日」→「記錄跟進」。若連編號或簽發日也改了，回清單「登錄證件示例」，選同一人、同類證件，填新編號與新日期→「儲存證件」，再開「預覽示例附件」看修改前版本。</p><p><strong>我說：</strong>新證件真的收到，才更新到期日；如果換了編號，就登錄新版本。之後主管再看總表，看到的是目前有效的那一份，舊的處理經過也保留。</p><p><strong>請確認：</strong>提醒提前幾天、哪些證件適用哪些員工，以及要通知本人、人資還是主管，請行政人事再幫我核對。</p></section><section><h2>請假第一步：員工填好並送出</h2><p>員工 · 林小安</p><p><strong>操作：</strong>切員工→「假勤申請」。有「待操作」草稿就開「申請明細／修改內容」；沒有就按「新增請假」。</p><p><strong>我說：</strong>接下來用一筆請假，讓大家看到每個角色怎麼接手。我現在是員工，先由本人填寫，其他角色不會代替他隨便把假單核准。</p><p><strong>操作：</strong>選年假，使用已發布班次日期中未重疊的 10:00–12:00、2 小時；事由「個人事務」，交接先填「已交接」。儲存草稿。</p><p><strong>我說：</strong>這裡填假別、起訖時間、時數、事由和交接安排。假別分類已經補充，正式適用條件、給薪和證明要求，還會跟公司制度一起核對。</p><p><strong>應該看到：</strong>草稿保存；尚未進主管的審核待辦。</p><p><strong>操作：</strong>按「送出申請」→彈出視窗「確認」。記住單號，後面沿用同一筆。</p><p><strong>我說：</strong>按送出以後，系統才把這一筆送給設定的處理人。員工可以看到目前狀態，也知道後面是誰要接。</p><p><strong>應該看到：</strong>狀態變待複核，顯示目前處理人及處理紀錄。</p></section><section><h2>請假第二步：退回、補充、複核、核准</h2><p>人資主管 → 員工 → 人資主管 → CEO → 員工</p><p><strong>操作：</strong>按「切換查看處理人」到人資主管→「退回修改」→原因「請補充交接人與待辦事項」→「確認」。</p><p><strong>我說：</strong>主管看到「已交接」三個字，可能還是不知道交給誰。這時不用另外傳訊息找人，就在這張單寫明要補什麼，再退回給員工。員工回來就知道是補資料，不是只能猜為什麼沒過。</p><p><strong>應該看到：</strong>同一筆變退回修改，原申請人的待辦出現補充工作。</p><p><strong>操作：</strong>切員工→同一單「修改內容」，交接補「林雅文協助確認待辦，當日下午回覆」→「儲存草稿」→「送出申請」→「確認」。</p><p><strong>我說：</strong>我再切回員工，補在原來這張單裡。前一次送出和退回的紀錄都留著，不需要重新建一張。</p><p><strong>操作：</strong>切換處理人→人資主管「複核通過」→「確認」；再切換處理人→CEO「核准」→「確認」。若畫面路線已被你改過，依該單顯示的處理人接續。</p><p><strong>我說：</strong>資料完整後，再依設定逐層處理。我先用人資主管複核，再切到 CEO 核准，讓大家看到兩個動作是分開的。</p><p><strong>應該看到：</strong>最後變已核准，員工可看到完整處理紀錄。</p><p><strong>操作：</strong>切回員工查看結果。需要展示防錯時再存相同時段草稿並嘗試送出；看到重疊提示後關閉，原核准單保持不變。</p><p><strong>我說：</strong>這幾天也加上了重複檢查。同一個人同一時段已有待審或核准請假，就不能再送一筆重疊的，避免額度和班表被重複計算。</p><p><strong>請確認：</strong>正式由誰複核、誰核准，仍以董總確認的權限表為準。今天先看這樣的接手和退回方式是否清楚。</p></section><section><h2>銷假、加班、外勤：各有內容，也能接續審核</h2><p>員工 → 單據指定處理人 → 員工</p><p><strong>操作：</strong>先保留剛才核准請假，讓後面的班表能展示衝突。現在先點「新增加班」或「新增外勤」看欄位。</p><p><strong>我說：</strong>除了請假，銷假、加班和外勤也在這裡。操作方式一致，但各自要填的資料會不同。</p><p><strong>操作：</strong>加班：填日期、時間、時數、原因及成果，儲存→送出→確認。依目前處理人逐層複核、核准。外勤再用另一筆，填外勤地點與工作，照同樣方式走到核准。</p><p><strong>我說：</strong>加班要交代做什麼、預計什麼成果；外勤要交代時間、地點和工作內容。都不是填完就直接算完成，還是要送到下一位處理人。</p><p><strong>應該看到：</strong>本人看到各自的結果；兩種申請各有單號與處理紀錄。</p><p><strong>操作：</strong>銷假放到班表衝突示範之後再做：從原核准請假按「申請銷假」→填原因→儲存／送出→各層複核核准→回看原單。</p><p><strong>我說：</strong>原本核准的假如果取消，也要有銷假紀錄，不能直接把那張假單刪掉。銷假核准後，餘額和班表才跟著調整。</p><p><strong>應該看到：</strong>銷假核准後額度回補，原請假與銷假紀錄都保留。</p></section><section><h2>年假和簽核設定：總表看結果，規則另外確認</h2><p>人資主管</p><p><strong>操作：</strong>人資主管→工作首頁→「每月年假總表」，選剛才請假月份與員工，再看「全員假勤總表」的來源。</p><p><strong>我說：</strong>月底如果要確認一個人還有多少假，現在就不用拿假單和另一張表一筆一筆對。先看這個月請了多少、哪些還在審、最後剩多少；有疑問，再點回那張假單。</p><p><strong>應該看到：</strong>已休、預留與可用餘額可對照原單；依目前已做過的操作顯示，不念固定餘額。</p><p><strong>操作：</strong>開員工自己的餘額，再回總表；指給大家看同一筆來源。</p><p><strong>我說：</strong>如果送審時先預留額度，最後核准就是轉成已休，不會再扣第二次。額度不足時也會擋住，避免先過了才發現變負數。</p><p><strong>操作：</strong>假勤申請→「假別與簽核設定」，展示現有路線、假別及餘額規則；這輪先查看，不在中途改正在展示的制度。</p><p><strong>我說：</strong>簽核也可以依公司、部門和申請種類，設定一層、兩層或三層。已經送出去的單會保留當時的路線，不會因為後來改設定，讓正在處理的單突然換人。</p><p><strong>請確認：</strong>年假起算、結轉、每天換算時數、各假別需要什麼證明，請依現行制度提供資料。正式簽核人、代理與跨公司情況，也需要一併核對。</p></section><section><h2>可視化排班：一天需要誰、缺在哪裡</h2><p>人資專員 → 人資主管 → 員工</p><p><strong>操作：</strong>人資進「排班與考勤 → 可視化班表」，選剛才請假的月份與日期。</p><p><strong>我說：</strong>比如主管要看下個星期哪一天人手比較緊，這裡不用先看一長串名單。直接看月曆，點那一天，就能看到誰上班、誰請假。哪裡需要再安排人，先從這裡找。這就是這次可視化班表最主要想幫上忙的地方。</p><p><strong>應該看到：</strong>同一天可看到班次與已核准請假，不用分開猜。</p><p><strong>操作：</strong>在另一個尚無班次的日期按「安排班次」；選同公司員工與班別→「送交主管發布」。切人資主管→待辦開該班次→「發布」→「確認」。切員工→「我的打卡」下方「我的班表」。</p><p><strong>我說：</strong>我現在試排一個班。人資先安排，主管看過才發布，員工再看自己的班表。這樣大家比較清楚哪一版才是已確認的安排，不會把還在調整的班表當成最後結果。</p><p><strong>應該看到：</strong>員工看到發布班次；草稿不冒充已發布結果。</p><p><strong>操作：</strong>切回人資，選剛才請假的日期→「查看崗位安排」，指「排班無衝突」「請假衝突」「尚無已發布班次」「需確認人力」。</p><p><strong>我說：</strong>再回到剛才請假的那一天。假設名字還排在這裡，但他有兩小時請假，系統會提醒這個重疊。主管就知道那兩小時要再確認誰接，不是看到名單有人就放心，也不是整天都算他沒來。</p><p><strong>我說：</strong>像只請兩小時，要處理的是這兩小時的人力安排，不會直接認定整天缺勤。班表是安排，打卡是實際到離時間，工作回報則是做了什麼，這三件事分開。</p><p><strong>請確認：</strong>哪些崗位一定要維持最低人數、部分時間請假怎麼補人，請現場主管用實際情況幫我們核對。</p></section><section><h2>換代班：接班人同意，主管核准才換班</h2><p>員工 → 接班人 → 授權主管</p><p><strong>操作：</strong>員工→「換班與代班」→「申請換代班」，選自己的已發布班次、接班人與原因。代班可用「林雅文」；互換需再選對方的有效班次。按「送交接班人」。</p><p><strong>我說：</strong>員工臨時有事，要找同事代班，最怕的是一邊以為講好了，另一邊其實還沒答應。所以我們讓接班人先確認，再交主管核准；最後班表才更新。大家看的是同一個結果。</p><p><strong>操作：</strong>點接班人的工作台，或上方切同一人；按「同意接班」→填說明→「確認」。若要演示婉拒，先「無法接班」，再由原申請人修改重送。</p><p><strong>我說：</strong>我切到接班人。對方可以同意，也可以說無法接班。這樣不會出現員工自己不知道，班表就被排過去了。</p><p><strong>操作：</strong>按目前處理人的工作台→「核准並更新班表」→填審核說明→「確認」。</p><p><strong>我說：</strong>接班人同意後，才交給有權限的主管核准。這次也修正了處理人選擇，會避開當事人和無權處理的主管。</p><p><strong>應該看到：</strong>班表改為接班人，申請保留同意與核准紀錄。</p><p><strong>操作：</strong>回可視化班表與崗位安排核對結果。若顯示衝突，主管退回，原申請人改同一筆重送；不要繞過提示。</p><p><strong>我說：</strong>如果接班人當時已經請假，或班次本身有衝突，核准就會被擋住，需要退回重新安排。這樣不會一邊說已請假，一邊又把他排去上班。</p><p><strong>操作：</strong>換代班結果看完後，示範另一種情況「原本的假不用請了」：回「假勤申請」找原核准假單→切原員工→「申請銷假」→填原因／交接、儲存草稿→「送出申請」。按單據顯示的處理人依序複核、核准。回同一天班表，再看員工假期餘額。</p><p><strong>我說：</strong>另外，如果原本的假後來不用請了，要從假單申請銷假，走完審核後，請假標記和剩餘額度才會更新。如果班已經換給別人，這件事也要另外協調；銷假不會自己把已核准的換代班撤銷。</p><p><strong>應該看到：</strong>已銷假的請假不再列為有效缺勤；額度回補，原申請與銷假紀錄都保留。</p></section><section><h2>打卡與補卡：記錄到離時間，異常再審核</h2><p>員工 → 人資主管 → 員工</p><p><strong>操作：</strong>員工→「我的打卡」。按畫面顯示的「上班打卡」或「下班打卡」，看當日紀錄。</p><p><strong>我說：</strong>打卡是記錄上班和下班，不代表那天的所有工作都已完成。我先用這個互動版展示記錄方式。</p><p><strong>應該看到：</strong>互動版留下示例打卡紀錄；不把它說成現場 GPS／照片驗證成功。</p><p><strong>操作：</strong>指「使用正式打卡」入口及定位／照片規則即可；為免中斷分享，不必現場離開示例去要求設備權限。</p><p><strong>我說：</strong>定位和現場照片是正式打卡入口的設定。今天這個頁面先讓大家看動線，真實裝置、定位範圍和拍照，另外做現場驗證。</p><p><strong>操作：</strong>按「申請補卡」，選已發生且沒有相同打卡的日期／類型／時間，填原因送出。切授權主管→待辦→核准或退回→填審核說明→確認。</p><p><strong>我說：</strong>如果漏打卡，員工要補日期、時間和原因，主管看過才成為正式的考勤紀錄。</p><p><strong>應該看到：</strong>核准後「考勤紀錄」多一筆有補卡來源的紀錄；退回不先補入。</p><p><strong>我說：</strong>要補資料時，也是在原單修改重送。月底會把這些還沒完成的項目一起列出來，避免漏了就直接結算。</p></section><section><h2>崗位與工作回報：有人排班，也要知道事情做完沒有</h2><p>人資／主管 → 被指派員工 → 驗收主管</p><p><strong>操作：</strong>人資→「崗位人力」→「新增崗位需求」，填日期、工作區、崗位、需求人數與安排人員→「送交主管」。</p><p><strong>我說：</strong>這裡再把人力和工作分開。崗位安排是在確認這一天、這個區域需要幾個人；工作回報是在確認安排的事情有沒有完成。</p><p><strong>操作：</strong>切另一位授權主管，從待辦開崗位安排，核對後按「核准發布」→填審核說明→「確認」；需要補充則「退回修改」。</p><p><strong>我說：</strong>主管核對人力和衝突後再發布，不是填了名單就代表人力足夠。</p><p><strong>應該看到：</strong>崗位狀態與人力核對更新，仍可看到衝突來源。</p><p><strong>操作：</strong>到「工作回報」→「指派工作」，選可切換的員工，填日期、區域及工作內容。切該員工→「回報完成」→填說明。切另一位主管→「驗收通過」或「退回補充」，填說明確認。</p><p><strong>我說：</strong>接著工作可以指派給實際執行的人。員工回報完成，主管再驗收；打卡、排班和工作完成都有自己的依據。</p><p><strong>應該看到：</strong>待辦從執行人移到驗收人，完成後留下回報與驗收紀錄。</p></section><section><h2>月底：先處理異常，再鎖定結果</h2><p>人資專員 → 人資主管</p><p><strong>操作：</strong>人資→「考勤月結」→月份選 2026-10→「載入月份」。核對待處理項目。</p><p><strong>我說：</strong>到月底，人資比較花時間的往往是找漏掉的紀錄：這個人少打一次卡，那張申請還沒回來。這頁先把沒有處理完的項目列出來，照著補完再送主管，不用等到做薪資的時候才回頭追。</p><p><strong>應該看到：</strong>有未決申請或未處理異常時不能送審；已結束且有資料的月份才可結算。</p><p><strong>操作：</strong>待核對與待審均為 0：按「送交主管審核」→填「核對／審核說明」→確認。切人資主管→「核准並鎖定」→填說明→確認。</p><p><strong>我說：</strong>人資先核對，再交另一位主管確認。這個月鎖定後，前面的資料就不能隨便回改。</p><p><strong>應該看到：</strong>狀態已鎖定，保留本次月結結果。</p><p><strong>操作：</strong>人資主管按「重新開啟月份」→寫原因→確認；看已保留的版本數。</p><p><strong>我說：</strong>如果之後真的要更正，要先說明原因重新開啟，再修正、重新送審。原來那一版會留著，查得到為什麼改。</p><p><strong>應該看到：</strong>重開後原月結版本還在，不是刪掉重算。</p><p><strong>請確認：</strong>月底誰核對、誰最後確認，以及哪些工時交給財務計薪，請人資和財務一起定。打卡參考工時不直接等於最後的薪資工時。</p></section><section><h2>考核第一步：先確認工作與比重</h2><p>人資主管 · 許嘉寧 → CEO</p><p><strong>操作：</strong>人資主管→「考核管理」。優先用林雅文的待操作草稿；沒有就「新增考核」，考核員工選林雅文。填名稱、期間、每項滿分 100。</p><p><strong>我說：</strong>考核如果到最後才問「你這個月表現幾分」，員工和主管很容易各想各的。所以先把要做的工作、做到什麼算完成、哪一項比較重要寫清楚，之後再拿實際成果來評。</p><p><strong>操作：</strong>編輯目標：工作完成 50%、文件品質 30%、交接回應 20%；各填完成標準→「儲存目標草稿」→「送 CEO 確認」→視窗「送出」。</p><p><strong>我說：</strong>這是工作項目的比重。像工作完成、文件品質和交接回應，各占多少，先在這裡講清楚。</p><p><strong>應該看到：</strong>目標比重合計 100%；送出後交上層確認。</p><p><strong>操作：</strong>切 CEO→同一考核「設定本期比重」→主管 60%、CEO 40%→「儲存比重」。再按「確認目標」，重新開啟確認視窗並按「確認目標」。</p><p><strong>我說：</strong>另外還有評核人的比重，這跟工作項目比重不同。例如主管的分數占多少、上層的分數占多少，要另外確認。</p><p><strong>應該看到：</strong>本期目標、滿分與合成比重固定保存；之後改設定不回改本期。</p></section><section><h2>考核第二步：分層評分，員工看得到結果怎麼算</h2><p>人資主管 → CEO → 人資專員 · 林雅文</p><p><strong>操作：</strong>人資主管→同一份「填寫主管評分」；三項填 80、90、85，每項填成果依據，再填整體評語→「送 CEO 評核」。</p><p><strong>我說：</strong>主管評分時，要有實際成果和依據。下一層看得到前面的內容，才能確認分數是否合理。</p><p><strong>操作：</strong>CEO 可先「退回補充評分」，填「請補充文件品質的具體依據」→退回主管。人資主管補原評分再送；CEO「填寫 CEO 評核」，三項填 85、92、88、各項依據與整體評語→「完成評核」。</p><p><strong>我說：</strong>如果依據不夠，上層可以退回補充。補完再送，不會把原先的紀錄直接消失。</p><p><strong>操作：</strong>切「人資專員 · 林雅文」→考核管理→「考核結果」→同一份「查看考核結果」，展開兩層評語與處理紀錄。</p><p><strong>我說：</strong>員工拿到結果，不只看到一個總分。他可以看到哪一項比較好、哪一項要改善，還有主管寫的原因。面談時就能照著這些內容談，比只說「這次表現要加強」更清楚。</p><p><strong>應該看到：</strong>若使用前段的同一組數字：主管 84、CEO 87.7，合成總分 85.48。</p><p><strong>請確認：</strong>考核的項目、標準、比重、週期，以及哪些能用數據計算，還需要跟董總和各部門主管確認。先以一個實際職務做完整範例，再套到其他職務。</p></section><section><h2>行政交辦：申請、指派、回報、驗收</h2><p>人資專員 → 人資主管 → CEO → 人資主管 → 員工 → 人資主管</p><p><strong>操作：</strong>人資專員→「專案交辦」→「新增交辦申請」，填「會議示範｜文件交接」、期限與成果，複核人選許嘉寧、核准人選 CEO→儲存草稿。</p><p><strong>我說：</strong>像整理一批文件、安排一次交接，事情交出去了，過幾天又要問做到哪裡，這種就適合放進來。有負責人、有期限，完成後能回報。很小的口頭交代，則不一定都要多填一張表。</p><p><strong>操作：</strong>人資「送交主管複核」→填說明→確認；人資主管複核；CEO「核准交辦」。每層都從待辦開同一筆並填說明。</p><p><strong>我說：</strong>先確認這件事要不要做，再指派誰做。提出人、複核人和核准人分開。</p><p><strong>操作：</strong>人資主管→「指派工作」，選林雅文或尚在行政職務的林小安，里程碑填「整理文件」「確認接手人」。切該執行人→「回報里程碑」，勾完成並填說明→「提交驗收」。人資主管→「驗收通過」或「退回改善」。</p><p><strong>我說：</strong>核准後，主管再指定執行人和里程碑。員工回報成果，最後由另一個人驗收。</p><p><strong>應該看到：</strong>未完成全部里程碑不能送驗收；完成後留回報、退回與驗收紀錄。</p><p><strong>請確認：</strong>行政交辦哪些值得追、哪些用原本溝通方式就夠，請給我們兩三個實際例子，避免多一套重複登錄。</p></section><section><h2>人事異動：送審完成，到了日期才生效</h2><p>人資專員 → 人資主管 → CEO → 人資專員 → 員工</p><p><strong>操作：</strong>人資→「人事異動 → 部門／職務調整」，用林小安尚未送審的草稿；若已有完成紀錄先查目前職務，不重送相同調整。</p><p><strong>我說：</strong>假設員工要從行政轉到工程，先把從哪一天開始、新職務是什麼確認好，再照流程生效。不是送出一張申請，就馬上換權限。人資和主管都查得到，他從哪一天開始做哪一份工作。</p><p><strong>操作：</strong>「填寫申請」→工程部／工程助理、生效日 2026-11-04、異動原因→「儲存草稿」→「送交人資主管複核」→視窗再次確認。</p><p><strong>我說：</strong>我先由人資填新職務、生效日期和原因，再送給人資主管複核。</p><p><strong>操作：</strong>人資主管「複核通過 → CEO」→視窗「複核通過」；CEO「核准異動」→同名確認；回人資查看「已核准・待生效」。</p><p><strong>我說：</strong>人資主管複核後送 CEO 核准。這時只是核准待生效，還不會立刻讓員工多出另一個部門的權限。</p><p><strong>操作：</strong>人資可按「重新送審」看原因欄位。若實作重送，填原因，修改草稿後完整再走複核及核准；不示範這支線則取消視窗。</p><p><strong>我說：</strong>這次補了一個修正入口。如果核准後發現日期或內容需要調整，人資可以重新送審，舊核准失效並留紀錄，重新確認後才生效。</p><p><strong>操作：</strong>人資「確認生效與權限變更」→「確認異動生效」；看「生效紀錄」。切林小安，看工程入口，再接後面的工程段。</p><p><strong>我說：</strong>最後由人資確認生效。我再切到員工，現在能看到工程工作；人資也能從生效紀錄回看前後的改變。</p><p><strong>應該看到：</strong>部門職務變更與生效歷史一致；未到生效日會阻擋。</p></section><section><h2>其他人事異動：每種類型都有自己的申請</h2><p>人資專員 → 人資主管 → CEO → 人資專員</p><p><strong>操作：</strong>依序開「新進到職、試用轉正、跨公司調動、離職與交接、復職」。每類選自己的草稿與示例人物，不拿同一人同時演多種互相衝突的異動。</p><p><strong>我說：</strong>其他異動也不是只有一個說明按鈕。每一種類型都可以從填寫開始，再經複核、核准到生效。</p><p><strong>操作：</strong>到職用林宥辰；轉正用王子晴；復職用郭怡君。各類：修改草稿→儲存→送交複核→人資主管複核→CEO 核准→人資確認生效。查看各自的前後差異。</p><p><strong>我說：</strong>新進到職要確認員工基本資料、部門職務和到職日；轉正要確認試用結果和生效日；復職則確認原員工的新任職安排。</p><p><strong>操作：</strong>跨公司調動用陳柏宇，確認 KYD → ZEUS、接收部門及生效日，照同一路線走完，再看前後資料。</p><p><strong>我說：</strong>跨公司調動要明確寫接收公司。只是去另一個項目支援，跟真正變更任職公司不同，不能混在一起。</p><p><strong>應該看到：</strong>原任職來源與新公司資訊留在異動紀錄；這是示例，不代表已開通真實跨公司帳號。</p><p><strong>操作：</strong>離職與交接用張可晴，補交接清單再走完整流程。調薪由財務開李承恩的草稿→CEO 複核→董事長核准→財務確認生效；與一般異動的路線分開。</p><p><strong>我說：</strong>離職還要交代交接內容和生效日。調薪則另外交由財務處理，不是一般人資權限就能看到所有人的金額。</p><p><strong>請確認：</strong>實際的生效確認人、離職停用和跨公司支援範圍，需要依現行名冊及權限表核對。今天先讓大家把各類操作走清楚。</p></section><section><h2>工程：工作指派、進度回報與驗收</h2><p>工程主管 → 工程員工 → 工程主管</p><p><strong>操作：</strong>切工程主管→「工程與專案」→既有「示例工程｜共享辦公區改善」→「開啟專案」。不要新建空專案來展示文件和預算。</p><p><strong>我說：</strong>工程這邊常常同時有好幾件事在跑。主管先看哪一件還沒完成、哪一件逾期、哪一件等驗收；再進去找負責人和回報，不用每件事都從聊天紀錄重新問一次。</p><p><strong>操作：</strong>「新增工作」→名稱「會議示範｜圖面核對」、承辦人選已調工程的林小安、期限、兩項檢核點及說明→儲存。</p><p><strong>我說：</strong>主管可以新增工作、指定承辦人、完成期限及檢查項目。員工只回報自己負責的工作，不會因為可以看專案就能改所有預算。</p><p><strong>操作：</strong>切林小安→同一專案／工作「更新進度」，填 100%、勾完所有檢核點、寫說明；「這次操作」選「回報完成，交主管驗收」→「儲存進度」。</p><p><strong>我說：</strong>我切成承辦員工，先回報進度，再把完成的工作送驗收。做到百分之百，跟主管驗收通過，是兩個不同階段。</p><p><strong>應該看到：</strong>工作變待驗收，主管待辦出現驗收項目。</p><p><strong>操作：</strong>工程主管→「驗收／退回」，先選退回改善並寫原因→「確認驗收」；員工補充重送後，主管再選驗收通過。</p><p><strong>我說：</strong>主管看完可以驗收，也可以退回改善。前一次回報和改善的紀錄都留下來。</p><p><strong>應該看到：</strong>已驗收的工作計入專案結果，承辦人不能自行驗收自己回報的工作。</p></section><section><h2>工程文件、預算與變更：最新版清楚，舊版可追</h2><p>工程主管</p><p><strong>操作：</strong>同一專案→「相關文件」→「查看最新版」→關閉→「版本紀錄」→查看舊版。需要演示更新時，主管「登記新版示例」，填內容與修改說明。</p><p><strong>我說：</strong>工程如果有人用舊圖、有人用新圖，後面就容易做錯。所以同一個專案的文件放在一起，先讓大家知道現在用哪一版；需要追之前怎麼改的，也找得到舊版。</p><p><strong>操作：</strong>「預算與費用」→「打開預算表」，展示來源、版本及分類。</p><p><strong>我說：</strong>預算也保留原提供人的表和版本，不是把一個數字放上來，就當作已付款或重新估價。</p><p><strong>應該看到：</strong>預算表與工作進度分開；金額不代表已入帳或已付款。</p><p><strong>操作：</strong>「工程變更」→「登記變更」，填主旨、原因、費用影響、工期影響與備註→「儲存變更紀錄」。再看「修改／撤回」和版本歷史。</p><p><strong>我說：</strong>工程有變更，就記原因、對費用和工期的影響。這裡先保留變更資料，不會登記一下就自動核准加錢。</p><p><strong>請確認：</strong>工程後續是否要接請款、需要哪些附件和核准人，請工程與財務一起確認。現階段先把工作、文件和變更追清楚。</p></section><section><h2>採購：需求、複核、核准、到貨分開</h2><p>工程主管 → 財務 → CEO → 原申請人 → 財務</p><p><strong>操作：</strong>工程主管→「採購作業」→既有草稿或「新增採購申請」，填用途、供應商、品項數量單價與說明→儲存→「送交財務複核」→確認。</p><p><strong>我說：</strong>採購從需要買什麼開始，先寫用途、供應商、品項和金額。供應商資料留在採購裡，不再另外增加一個左側選單。</p><p><strong>操作：</strong>財務→同一單「複核通過」→視窗填說明／確認；CEO「核准採購」→確認。示範退回時先回原工程主管補充重送。</p><p><strong>我說：</strong>我切財務核對，再切 CEO 核准。需要補充時，退回原申請人修改同一筆，不要重新建好幾張。</p><p><strong>操作：</strong>切原申請人→「登記到貨驗收」，填驗收結果→確認；切財務→「建立相關傳票」或已有的「查看相關傳票」。</p><p><strong>我說：</strong>對財務來說，主管說可以買了，跟東西真的收到了，是兩件事。這裡把到貨和驗收留下來，後面處理帳務時，就不用只靠一句「應該已經收到了」去猜。</p><p><strong>應該看到：</strong>採購狀態已到貨驗收；傳票仍是另行處理的草稿，不重複建帳。</p></section><section><h2>培訓：報名、出席、證照連在一起</h2><p>人資專員 → 員工 → 人資專員 → 員工</p><p><strong>操作：</strong>人資→「培訓與獎懲 → 課程」→「新增課程」。要當場連續示範報名和出席，課程日期設示例基準日 2026-11-04，填名稱、地點、講師、內容後儲存。</p><p><strong>我說：</strong>如果要確認誰上過某個課，這裡可以直接查課程和參加人。人資比較不用另外找一份報名表，再問現場那天誰真的有來。</p><p><strong>操作：</strong>切員工→新課「報名課程」。切人資→同課「登記出席」→「登記／修改出席」→選出席狀態並儲存。</p><p><strong>我說：</strong>員工可以從自己的畫面報名，人資再確認出席。報名和真的上完課是分開記的。</p><p><strong>應該看到：</strong>人資看到報名者；完成出席登記後課程狀態更新。</p><p><strong>操作：</strong>人資→「證照」→「登錄證照」，填員工、名稱、核發單位、日期、編號、期限→儲存；切該員工→「查看證照」→「預覽示例證明」。</p><p><strong>我說：</strong>需要保存證照或完成紀錄時，再登錄核發單位和期限，員工也能查看自己的紀錄。</p><p><strong>應該看到：</strong>出席與證照各有紀錄，不把示例證明當正式外部證照。</p></section><section><h2>表揚、違紀與申覆：有依據，也有回應機會</h2><p>人資專員 → 人資主管 → 員工 → 人資主管</p><p><strong>操作：</strong>人資→「表揚」→「新增表揚」，選示例員工、日期、主題、原因與佐證→儲存→「送交複核／送交獨立複核」→填說明→確認。</p><p><strong>我說：</strong>表揚或違紀也要留清楚的原因和獨立確認，不是某個人登記後就直接變成定案。</p><p><strong>操作：</strong>人資主管→同筆「核定紀錄」或「退回補充」→填說明→確認。若示範違紀，用「違紀」中的示例，不針對真實員工填寫指控。</p><p><strong>我說：</strong>我切人資主管看資料，能核定，也能退回補充。違紀的登記也走同樣的獨立確認。</p><p><strong>操作：</strong>切員工→本人已核定的違紀紀錄→「提出申覆」，填理由與佐證→送出；人資主管→「申覆」→「回覆申覆」，填查核結果→「記錄回覆」；切員工查看回覆。</p><p><strong>我說：</strong>員工如果對自己的違紀紀錄有需要補充的地方，可以提出申覆；處理人再查核並留下回覆。</p><p><strong>應該看到：</strong>原紀錄與申覆、回覆一起保留，不自動扣薪或修改考核。</p><p><strong>請確認：</strong>哪些紀錄由誰登記、誰核定，以及申覆怎麼處理，需要人資提供目前做法，我們再對齊。</p></section><section><h2>薪酬與社保：分公司編製，員工只看自己的結果</h2><p>財務 → CEO → 董事長 → 財務 → 員工</p><p><strong>操作：</strong>切財務→「薪酬與社保」，確認選「功能操作示範」→「薪資設定」查看組成，再開「計薪批次」。只用示例金額。</p><p><strong>我說：</strong>薪資要先按任職和發薪公司分開，員工支援另一個項目，不會自動改成另一家公司發薪。這裡先展示編製、核對和確認的流程。</p><p><strong>操作：</strong>選未完成批次，例如 2026-11；已完成則「新增計薪批次」選未使用月份。用「調整項目」核對金額→「送交 CEO 複核」；CEO「複核通過」；董事長「核准批次」；財務「確認薪資單」。各步填處理說明並確認。</p><p><strong>我說：</strong>財務先核對這個月的人員和金額，再交上層複核與核准。核准後仍要由財務確認薪資單，員工才看到自己的結果。</p><p><strong>應該看到：</strong>批次變薪資單已確認；不等於已執行銀行轉帳。</p><p><strong>操作：</strong>切員工→「薪酬與社保／我的薪資單」→該月份「查看薪資明細」。</p><p><strong>我說：</strong>員工如果想確認自己的薪資明細，可以直接看自己的那一張；財務不用每次都另外整理回覆。別人的薪資不會因為同在一個部門，就一起開放給他看。</p><p><strong>操作：</strong>切財務→「社保紀錄」，選已確認月份→「登記繳納紀錄示例」，看收據參考與日期欄位；確認這只是記錄，不執行申報或付款。</p><p><strong>我說：</strong>社保也能留下月份、金額和繳納參考紀錄。正式費率、扣款和計薪規則仍要由人資、財務確認，今天先看資料怎麼交接。</p></section><section><h2>財務會計：先保留操作方向，等董總確認承接方式</h2><p>財務專員</p><p><strong>操作：</strong>財務→「財務會計」，展示目前公司的科目、傳票與報表入口；再指明公司選擇。</p><p><strong>我說：</strong>財務這一塊，董總之前提的科目、傳票、總帳和報表需求，我都保留著。今天先讓大家看資料如何分公司、如何經過確認，不會因為我們現在把畫面做出來，就直接當成已經取代正式會計系統。</p><p><strong>我說：</strong>這幾天董總比較忙，財務這部分我還在等她回覆。主要要確認，是由 ERP 整理單據後交給會計、跟現有或成熟的會計系統串接，還是真的由我們承接完整財會。</p><p><strong>我說：</strong>我們希望先把正式帳本放哪裡、誰來核對、要哪些報表講清楚。選定方式後，再請財務或會計用正確範例一起驗收，這樣才不會兩邊各做一份，最後數字對不起來。</p><p><strong>操作：</strong>下一段可接完整傳票操作；若會議只需要說明財會方向，可用段落選單直接到「董事長看到的畫面」。</p><p><strong>我說：</strong>我接著用一筆示例傳票帶流程，只是讓大家看建單、複核、核准和入帳怎麼分工。正式範圍仍等確認。</p></section><section><h2>財務示例：傳票到入帳，再看報表</h2><p>財務 → CEO → 董事長 → 財務</p><p><strong>操作：</strong>用待操作傳票或「新增傳票」：參考號「MEETING-1112」、日期 2026-11-04，借方一般費用 100、貸方應付帳款 100，填摘要後儲存。若已有同參考號，沿用原單，避免重複建。</p><p><strong>我說：</strong>一開始只是草稿，還不進帳。每筆資料要先有公司、日期和科目，借貸也必須平衡。</p><p><strong>操作：</strong>財務「送交複核」→填說明／同名確認；CEO「複核通過」→填說明→「複核傳票」；董事長「核准傳票」→填說明／確認；財務「確認入帳」→填說明／確認。</p><p><strong>我說：</strong>財務送出後，先由 CEO 複核，再由董事長核准，最後仍回財務確認入帳。核准跟真正入帳是不同動作。</p><p><strong>應該看到：</strong>只有已入帳的收入費用科目才進管理看板。這筆是費用／應付，不代表銀行付款。</p><p><strong>操作：</strong>查看同筆分錄，再開總帳、試算與報表，選包含該日期的期間。示範更正可按「建立沖回傳票」，形成新草稿後重新走審核入帳；不要為了展示直接刪原單。</p><p><strong>我說：</strong>入帳後可以追到分錄、總帳和報表。需要更正時，要留下原帳和沖回的關係，不是直接把舊數字改掉。</p><p><strong>操作：</strong>展示「檢查與匯入 CSV」及「下載 CSV」；只用去識別的示例，預覽不等於入帳。關帳入口先看檢查結果，未完成單據先處理，不強行鎖定。</p><p><strong>我說：</strong>大量資料可以先預覽匯入，確認欄位與錯誤再建立草稿；關帳也要先核對未完成單據。正式的科目表和匯入格式，要請財務提供。</p></section><section><h2>董事長看到的畫面：先掌握重點，再追來源</h2><p>董事長；再對照 CEO／部門主管</p><p><strong>操作：</strong>上方選「董事長」→「工作首頁」。使用預設「管理總覽」，不用點任何以個人姓名命名的捷徑。</p><p><strong>我說：</strong>前面我們看的是大家怎麼做事。現在換成董事長。如果每次要了解公司近況，都要一個一個問部門，就很難很快看出重點。這個畫面先把各部門狀況和需要注意的事情放在前面，有疑問再往下看。</p><p><strong>操作：</strong>統計週期選「本月」，截止日期選 2026-11-04→「更新總覽」。依序指財務大類、需關注事項、各部門近況、工程進度。</p><p><strong>我說：</strong>這裡先彙總收入、費用、人員、考核和工程狀況。董事長不用一進來就看所有表單，但看到有疑問的地方，可以往下點回來源。</p><p><strong>應該看到：</strong>數字來自目前示例已完成的紀錄；不同狀態不混算。</p><p><strong>操作：</strong>點「考核結果」「工作與里程碑」或「核對帳務來源」之一，開原資料後返回首頁。</p><p><strong>我說：</strong>像剛才完成的考核、已驗收的工程，以及已入帳的費用，就能回到這裡對照。財務只用已入帳資料，不能把還在申請的錢當成收入或支出。</p><p><strong>操作：</strong>如要展示另一公司，從上方切公司，再按期間更新。對照各公司已入帳摘要，不把不同幣別直接合併。</p><p><strong>我說：</strong>不同公司仍分開看。我們也會再跟董事長確認，最常看的三到五個重點是什麼，把那些放在最前面，其他細節交給主管處理。</p><p><strong>操作：</strong>切 CEO→工作首頁；再切工程主管→工作首頁。示範「我的工作與申請」仍能回到本人工作。</p><p><strong>我說：</strong>CEO 可能會接著追：這件事卡在哪裡、誰來處理；部門主管則要知道：今天誰能上班、哪件工作要趕、哪些申請等我確認。所以會依職務，把常用的內容放前面，不讓每個人都先面對一大堆相同的表單。</p><p><strong>請確認：</strong>董事長，您最希望第一眼看到哪三到五件事？比較常按公司、項目，還是部門看？哪些異常需要特別提醒您？</p></section><section><h2>報表與設定：權限、提醒和操作紀錄</h2><p>人資主管；必要時系統管理員</p><p><strong>操作：</strong>人資主管→「報表與設定」→「人力報表」→「角色與權限」，對照部門與職務。</p><p><strong>我說：</strong>最後這一區是管理設定和核對。人力報表讓主管看人員分布，權限則把每個角色能看、能做的範圍分開。</p><p><strong>操作：</strong>「提醒設定」→「修改提醒設定」展示欄位，尚未決定則取消；「操作紀錄」查看剛才流程。</p><p><strong>我說：</strong>證件多久前提醒、幾天再跟進，可以在這裡調整。發生過哪些操作，也能回看紀錄，方便查問題。</p><p><strong>操作：</strong>「匯入預覽」→「欄位對應」→「預覽資料」。只使用內建兩筆示例，展示公司／部門／姓名欄位，最後「完成預覽」。</p><p><strong>我說：</strong>這裡也保留員工資料匯入前的欄位檢查，先找出對應錯誤，避免直接把不正確的資料塞進去。</p><p><strong>應該看到：</strong>此入口只記錄預覽結果，不把兩筆假員工匯入真實名冊。</p><p><strong>我說：</strong>正式的細分權限仍需要一張確認過的表，像能看、能新增、能複核、能核准、能匯出，要分開列。今天切換示例角色，是讓大家看出差異，不是每個正式帳號都能自己任意換角色。</p></section><section><h2>手機與語言：同樣能接手自己的工作</h2><p>員工／主管</p><p><strong>操作：</strong>若方便，另開手機版網址；分享時仍以電腦畫面為主。手機點上方姓名／角色卡→選角色，再從底部「待辦」進對應單據。</p><p><strong>我說：</strong>手機版也保留同樣的操作邏輯。員工可以從手機提出申請，主管可以看自己的待辦，並不是手機只有幾張不能操作的畫面。</p><p><strong>操作：</strong>展示手機角色選單、待辦、模組與鈴鐺。若手機沒有電腦剛才的單，是不同瀏覽器各自的示例資料，不要說已同步。</p><p><strong>我說：</strong>切換角色後，會進那個角色的首頁；再從待辦找到同一筆工作接著處理。正式使用時，就由不同帳號各自處理自己的步驟。</p><p><strong>操作：</strong>用右上語言選單切 English，再切 ខ្មែរ，最後切回繁中。</p><p><strong>我說：</strong>語言目前保留繁體中文、英文和高棉文，可以切換看看哪一種比較方便使用。實際表單上的用語，後續也請使用同事幫忙核對。</p></section><section><h2>ERP 與 PMS：操作範圍清楚，彙整方式保留彈性</h2><p>管理層</p><p><strong>操作：</strong>開「前往 PMS」入口，展示範圍說明；目前沒有確認的 PMS 連結就停在說明頁。</p><p><strong>我說：</strong>今天我帶的是 ERP 這邊的人事、內部協作、工程採購和公司管理流程。物業、租約、維修及客訴，由 Richard 接著說明 PMS 的部分。</p><p><strong>我說：</strong>排班考勤目前在 ERP 的互動版裡可以操作。後面如果沿用既有考勤工具，或要跟 PMS 交換資料，還是可以討論；重要的是人員、公司和需要的結果能對得起來。</p><p><strong>我說：</strong>看板可以彙整重要資料，但不代表每個子系統都一定要重做在同一個地方。實際怎麼串接、哪些資料由哪一邊提供，我再跟 Richard 對齊。</p></section><section><h2>收尾：請大家確認使用方式，制度逐項補齊</h2><p>切回董事長或人資總覽</p><p><strong>我說：</strong>今天這一輪，大家可以想一下：平常哪些事情是靠訊息一直追，哪些是到月底才發現漏了，哪些是不知道該找誰。我們希望把這些事情放到清楚的位置，讓下一位知道輪到他做什麼，最後也找得到結果。</p><p><strong>我說：</strong>接下來我希望請實際會使用的人再走一次，告訴我哪一步跟現在工作不一樣、哪些欄位沒有必要、哪些資訊應該提早看到。我們用實際操作來確認，不只看畫面好不好看。</p><p><strong>我說：</strong>還需要確認的，主要是准假和簽呈權限、假別與餘額規則、考核項目和比重、各角色可看的公司與部門，以及董事長看板的優先資訊。財務承接方式則等董總方便回覆後，再跟財務一起確認。</p><p><strong>我說：</strong>今天能確認的，我會整理進紀錄；還需要資料的，就先留下提供人和時間。接下來請 Richard 接著說明 PMS 的部分。</p></section></noscript>
<script id="content-data" type="application/json">{"chapters": [{"id": "prepare", "title": "開會前，手機與電腦先各自準備好", "tag": "只給 IAN 看 · 不用念", "role": "電腦分享 ERP；手機讀講稿", "route": "home", "intro": "這是今天的新會議完整帶操作稿，統整 11 月 4 日會議至 11 月 12 日的調整。全篇的高層看板統一稱「董事長看到的畫面」；CEO 與董事長仍是不同審核角色。", "actions": ["電腦只分享會議互動版的瀏覽器視窗；手機開這份講稿。不要把講稿、密碼或私人通知一起分享。開場先用「人資專員」，公司選 KYD。", "這份有逐段切換、段落下拉選單、字體放大及「全部展開」。白底是要念的話，藍底是操作，綠底是應看到的結果。用下一段往下走，不必把操作提示念出來。", "先重新整理 ERP 一次，保留原有資料與操作紀錄，不按「重設示例」。上方切角色只供會議示範，正式使用會依各人的帳號授權。", "真實名冊若要展示，會前自行登入「員工與組織」並確認已載入。不要在共享畫面時輸入密碼。其他流程採示例人物與單據，不把示例人數說成真實員工總數。", "優先使用原瀏覽器裡名稱含「待操作」的請假、考核、人事及財務草稿。如果找不到，按各段的新增入口建立。不要依賴固定單號；記住這次的姓名、名稱與單號。", "示例日期固定為 2026-11-04。排班用這一天或其後日期，月結選已有資料的 2026-10。每次切角色後核對公司；依畫面目前狀態操作，已完成的單不會再出現送審按鈕。", "主線順序：先請假、排班及考核，再做林小安轉工程部，最後帶工程。若林小安已是工程職務，先展示既有生效結果，工程段可直接接續；不要為了講稿回改真實名冊。", "請假用已發布班次中的兩小時，先核對有沒有重疊假單；已有核准單可直接接著展示總表及銷假。不要再建同時段重複請假。", "所有模組完整走完會比只報告改動久。可依會議時間用上方選單跳段，但每條示範流程盡量走到最後結果再換主題。", "手機和電腦各自保存示例狀態，不會跨裝置自動同步。這次主流程在同一台電腦切角色；手機只讀稿。若展示手機版，說明它可獨立操作。"], "tips": ["這次只整理講稿與操作提示，不替 KYD 決定尚未確認的制度，也不修改系統功能。", "上次的稿和本次之前的系統版本都保留。本次講稿是新檔案。"]}, {"id": "opening", "title": "開場：先讓大家知道今天會看到什麼", "role": "人資專員", "route": "home", "steps": [{"say": "各位主管好，我是 IAN。今天我會把 ERP 的方向再完整說明一次，也把上次會議到現在的調整一起帶過。前一次沒有參加的主管，也可以從今天這一輪看懂整套系統怎麼用。"}, {"say": "今天我不會一頁一頁念功能名稱。我們用幾件平常會發生的事來走：有人請假、要找人代班、文件快到期、工作做完要交主管確認。我會切換不同角色，讓大家看到事情怎麼從一個人交到下一個人。"}, {"say": "上次大家很重視一件事，就是像證件與合約那樣，一打開就看得出整體狀況。所以這次的調整，也把這個做法帶到人事、考勤、排班和管理看板：先看哪裡需要處理，再點進去看原因。"}, {"say": "今天示範用的是會議互動版。原本員工和公司的真實資料保留，操作流程另外用示例資料。大家可以直接看使用方式，再告訴我哪些地方跟實際工作不一樣。"}], "tag": "開場 · 先說這四段", "tips": []}, {"id": "changes", "title": "先講這段時間改了哪些重點", "role": "人資專員", "route": "home", "steps": [{"say": "從上次會議到現在，第一個重點是總表。人資和主管除了自己的待辦，也能看授權範圍內所有人的狀況，包括證件、假勤、工時和年假。沒有資料的人也列出來，才不會漏掉。"}, {"say": "第二個是請假和排班接起來。假單核准後，總表、餘額和班表可以對照；班表改成月曆看，也會指出請假衝突、還沒有發布的班次和需要補人的地方。"}, {"say": "第三個是每一個角色真的能接著做。這幾天又檢查了退回、重送、複核、核准和生效，補掉重複請假、找錯審核人，以及核准後要改日期卻沒入口的問題。"}, {"say": "第四個是管理層先看重點。董事長看到的是公司的狀況、部門近況和需要注意的事情；主管再往下看自己負責的工作。工程、採購、薪資和其他原有模組也保留，今天會一起帶過。"}], "tag": "會後改動 · 約 2 分鐘", "tips": ["前面說的總表、假勤規則、可視化班表及管理看板是會後補強；工程等既有模組是保留與檢查，不說成全部這週新做。", "最新五項修正：重疊請假、有效處理人、接班人請假衝突、職務重新送審、生效紀錄。稍後放到對應畫面再說。"]}, {"id": "employee", "title": "先看員工：自己的工作放在一起", "role": "員工 · 林小安", "route": "home&dashboard=work", "steps": [{"say": "假設我是員工，昨天送了一張假單，今天最想知道的就是過了沒有、還是要補什麼。從自己的首頁就能找，不用再去翻聊天紀錄，問人資有沒有收到。", "action": "上方「流程示範角色」選「員工 · 林小安」→「工作首頁」。", "result": "首頁顯示這個角色的待辦、本人申請與可用入口。"}, {"say": "這裡的「我的申請」，是看我自己送出去的東西；「申請與簽核」，是看現在輪到我處理的事情。兩者分開，就比較不會把自己的進度和別人交給我的工作混在一起。", "action": "開「我的申請」查看不同種類及狀態，再開「申請與簽核」。", "result": "同一筆單據能從對應清單進入，角色切換不會另建一張。"}, {"say": "主管和董事長也一樣有自己的個人工作入口。管理職務多了管理和簽核，不代表他們就沒有請假、自己的通知或個人的申請。", "action": "稍後切管理層時，指一下「我的工作與申請」入口。"}], "tag": "操作逐字稿", "tips": []}, {"id": "people", "title": "員工與組織：任職公司和支援工作分開", "role": "人資專員", "route": "people", "steps": [{"say": "這裡沿用原本提供的員工資料，先把員工在哪家公司、哪個部門、什麼職務列清楚。同一批人可以支援不同項目，但不代表任職公司或發薪公司會跟著換。", "action": "切「人資專員」→「員工與組織」。只有已登入且名冊載入成功，才展示真實清單；否則先說明入口，不把示例當真實名冊。"}, {"say": "像 KY iCenter 和 Golden One，工作可能由同一批人協作，但管理公司和出帳公司仍要分開。之後一筆申請或費用屬於哪家公司，也要能查清楚。", "action": "查看公司篩選、員工資料，再切「公司與部門組織」。只開展示必要欄位，避開未授權的薪資與證件內容。"}, {"say": "這裡的目的是先把資料歸屬弄清楚。真的要調動任職或職務，會走後面的人事異動流程，不是換一個篩選就把員工換公司。"}], "tag": "操作逐字稿", "tips": ["實際名冊四家公司以已載入的名冊為準；不要因示例只準備 KYD／ZEUS，就說公司只有兩家。"]}, {"id": "overview", "title": "人資和主管：先看完整狀況，再處理問題", "role": "人資專員 → 人資主管 → 工程主管", "route": "hr-overview", "steps": [{"say": "這是這次比較重要的改進。上次提到證件與合約看起來清楚，我們就把同樣的方式用在人事總覽：先把人列齊，再把需要處理的事情標出來。", "action": "人資專員進「工作首頁／人事管理總覽」，選月份、部門或搜尋人員，按「套用篩選」。", "result": "有待查、待核對、已核對等狀態；未登錄資料的人仍出現在總表。"}, {"say": "例如月底有人問：哪些人的證件還沒補、誰的打卡需要核對？人資可以先從這張表找，不用先打開每個人的資料才知道有沒有問題。需要處理哪一筆，再點進去看。", "action": "點一位員工的「核對資料」，查看各項來源；再返回總覽。", "result": "返回後可保留原月份和篩選，來源有變動時會提醒重新核對。"}, {"say": "如果需要，人資也可以留下核對說明。但在這裡寫已核對，不會把過期證件變有效，也不會代替主管簽核。", "action": "展示核對狀態與說明入口；若保存，填「會議示範：已查看來源，後續待補資料」。"}, {"say": "我再切到工程主管。這時看的是自己負責的部門，並不是所有人的資料都開放。看得到哪些人，跟能不能修改、複核或核准，會分開管理。", "action": "切「工程主管 · 周以辰」→「工作首頁」，對照名單範圍；再切回人資專員。"}, {"ask": "這樣先看整體、再查明細的方式，是否符合人資和主管平常的管理習慣？哪些欄位還需要放在第一眼就能看到的位置？", "qid": "scope"}], "tag": "會後重點 · 總表與可視化", "tips": []}, {"id": "documents", "title": "證件與合約：看得到到期，也追得到處理進度", "role": "人資專員 → 員工 → 人資專員", "route": "documents&source=example&tab=overview", "steps": [{"say": "證件與合約仍保留大家覺得清楚的做法。這張表把勞動合約、護照、工作許可、簽證等放在一起，正常、快到期、已到期或還沒登錄，都能分開看。", "action": "人資進「證件與合約」，選「功能操作示範」資料來源，再進「全員證件總表」。先展示整張表，再點林小安的工作許可。", "result": "點狀態能開同一人的證件明細。未登錄表示待核對，不直接等於不適用或違規。"}, {"say": "以前看到證件快到期，可能先傳一則訊息提醒，但過幾天就忘了對方有沒有處理。這裡可以記下已經提醒、正在續辦，還有哪一天要再追。換一位同事接手，也知道前面做到哪裡。", "action": "點林小安已到期的「工作許可」狀態，在明細把「跟進狀態」選「續辦中」，填「處理內容」與「下次跟進日期」→「記錄跟進」。先不填新到期日。", "result": "新跟進紀錄出現；證件仍到期，不會因為寫續辦中就變有效。"}, {"say": "本人也需要知道這件事。我現在切回員工，從右上角通知就能看到自己的提醒，點下去會回到該筆資料。", "action": "切員工→右上角鈴鐺→自己的證件提醒→開明細；再展示已讀狀態。", "result": "員工看到自己的提醒，人資仍可查看授權範圍內的整體狀況。"}, {"say": "新證件真的收到，才更新到期日；如果換了編號，就登錄新版本。之後主管再看總表，看到的是目前有效的那一份，舊的處理經過也保留。", "action": "切回人資，開剛才的證件明細：跟進狀態選「已收到新證件」，填處理內容、下次跟進日期及「新到期日」→「記錄跟進」。若連編號或簽發日也改了，回清單「登錄證件示例」，選同一人、同類證件，填新編號與新日期→「儲存證件」，再開「預覽示例附件」看修改前版本。"}, {"ask": "提醒提前幾天、哪些證件適用哪些員工，以及要通知本人、人資還是主管，請行政人事再幫我核對。", "qid": "documents"}], "tag": "操作逐字稿", "tips": ["目前示範的是站內通知。Email 和手機推播尚未接通，不說已經會自動寄信。", "先切員工看過期提醒，再回人資更新期限。若先完成續辦，過期提醒就可能已經消除。"]}, {"id": "leave-start", "title": "請假第一步：員工填好並送出", "role": "員工 · 林小安", "route": "leave", "steps": [{"say": "接下來用一筆請假，讓大家看到每個角色怎麼接手。我現在是員工，先由本人填寫，其他角色不會代替他隨便把假單核准。", "action": "切員工→「假勤申請」。有「待操作」草稿就開「申請明細／修改內容」；沒有就按「新增請假」。"}, {"say": "這裡填假別、起訖時間、時數、事由和交接安排。假別分類已經補充，正式適用條件、給薪和證明要求，還會跟公司制度一起核對。", "action": "選年假，使用已發布班次日期中未重疊的 10:00–12:00、2 小時；事由「個人事務」，交接先填「已交接」。儲存草稿。", "result": "草稿保存；尚未進主管的審核待辦。"}, {"say": "按送出以後，系統才把這一筆送給設定的處理人。員工可以看到目前狀態，也知道後面是誰要接。", "action": "按「送出申請」→彈出視窗「確認」。記住單號，後面沿用同一筆。", "result": "狀態變待複核，顯示目前處理人及處理紀錄。"}], "tag": "操作逐字稿", "tips": ["若系統提示時段重疊，先查看既有請假；可以沿用已核准單展示後續，或選另一個無衝突時段，不必重設示例。"]}, {"id": "leave-relay", "title": "請假第二步：退回、補充、複核、核准", "role": "人資主管 → 員工 → 人資主管 → CEO → 員工", "route": "leave", "steps": [{"say": "主管看到「已交接」三個字，可能還是不知道交給誰。這時不用另外傳訊息找人，就在這張單寫明要補什麼，再退回給員工。員工回來就知道是補資料，不是只能猜為什麼沒過。", "action": "按「切換查看處理人」到人資主管→「退回修改」→原因「請補充交接人與待辦事項」→「確認」。", "result": "同一筆變退回修改，原申請人的待辦出現補充工作。"}, {"say": "我再切回員工，補在原來這張單裡。前一次送出和退回的紀錄都留著，不需要重新建一張。", "action": "切員工→同一單「修改內容」，交接補「林雅文協助確認待辦，當日下午回覆」→「儲存草稿」→「送出申請」→「確認」。"}, {"say": "資料完整後，再依設定逐層處理。我先用人資主管複核，再切到 CEO 核准，讓大家看到兩個動作是分開的。", "action": "切換處理人→人資主管「複核通過」→「確認」；再切換處理人→CEO「核准」→「確認」。若畫面路線已被你改過，依該單顯示的處理人接續。", "result": "最後變已核准，員工可看到完整處理紀錄。"}, {"say": "這幾天也加上了重複檢查。同一個人同一時段已有待審或核准請假，就不能再送一筆重疊的，避免額度和班表被重複計算。", "action": "切回員工查看結果。需要展示防錯時再存相同時段草稿並嘗試送出；看到重疊提示後關閉，原核准單保持不變。"}, {"ask": "正式由誰複核、誰核准，仍以董總確認的權限表為準。今天先看這樣的接手和退回方式是否清楚。", "qid": "approval"}], "tag": "操作逐字稿", "tips": []}, {"id": "other-leave", "title": "銷假、加班、外勤：各有內容，也能接續審核", "role": "員工 → 單據指定處理人 → 員工", "route": "leave", "steps": [{"say": "除了請假，銷假、加班和外勤也在這裡。操作方式一致，但各自要填的資料會不同。", "action": "先保留剛才核准請假，讓後面的班表能展示衝突。現在先點「新增加班」或「新增外勤」看欄位。"}, {"say": "加班要交代做什麼、預計什麼成果；外勤要交代時間、地點和工作內容。都不是填完就直接算完成，還是要送到下一位處理人。", "action": "加班：填日期、時間、時數、原因及成果，儲存→送出→確認。依目前處理人逐層複核、核准。外勤再用另一筆，填外勤地點與工作，照同樣方式走到核准。", "result": "本人看到各自的結果；兩種申請各有單號與處理紀錄。"}, {"say": "原本核准的假如果取消，也要有銷假紀錄，不能直接把那張假單刪掉。銷假核准後，餘額和班表才跟著調整。", "action": "銷假放到班表衝突示範之後再做：從原核准請假按「申請銷假」→填原因→儲存／送出→各層複核核准→回看原單。", "result": "銷假核准後額度回補，原請假與銷假紀錄都保留。"}], "tag": "操作逐字稿", "tips": ["不要說核准加班就已自動算出正式加班費；計薪規則另由人資／財務核定。"]}, {"id": "balance", "title": "年假和簽核設定：總表看結果，規則另外確認", "role": "人資主管", "route": "hr-overview&tab=leave", "steps": [{"say": "月底如果要確認一個人還有多少假，現在就不用拿假單和另一張表一筆一筆對。先看這個月請了多少、哪些還在審、最後剩多少；有疑問，再點回那張假單。", "action": "人資主管→工作首頁→「每月年假總表」，選剛才請假月份與員工，再看「全員假勤總表」的來源。", "result": "已休、預留與可用餘額可對照原單；依目前已做過的操作顯示，不念固定餘額。"}, {"say": "如果送審時先預留額度，最後核准就是轉成已休，不會再扣第二次。額度不足時也會擋住，避免先過了才發現變負數。", "action": "開員工自己的餘額，再回總表；指給大家看同一筆來源。"}, {"say": "簽核也可以依公司、部門和申請種類，設定一層、兩層或三層。已經送出去的單會保留當時的路線，不會因為後來改設定，讓正在處理的單突然換人。", "action": "假勤申請→「假別與簽核設定」，展示現有路線、假別及餘額規則；這輪先查看，不在中途改正在展示的制度。"}, {"ask": "年假起算、結轉、每天換算時數、各假別需要什麼證明，請依現行制度提供資料。正式簽核人、代理與跨公司情況，也需要一併核對。", "qid": "leave"}], "tag": "會後重點 · 假期與簽核", "tips": []}, {"id": "schedule", "title": "可視化排班：一天需要誰、缺在哪裡", "role": "人資專員 → 人資主管 → 員工", "route": "attendance&tab=calendar", "steps": [{"say": "比如主管要看下個星期哪一天人手比較緊，這裡不用先看一長串名單。直接看月曆，點那一天，就能看到誰上班、誰請假。哪裡需要再安排人，先從這裡找。這就是這次可視化班表最主要想幫上忙的地方。", "action": "人資進「排班與考勤 → 可視化班表」，選剛才請假的月份與日期。", "result": "同一天可看到班次與已核准請假，不用分開猜。"}, {"say": "我現在試排一個班。人資先安排，主管看過才發布，員工再看自己的班表。這樣大家比較清楚哪一版才是已確認的安排，不會把還在調整的班表當成最後結果。", "action": "在另一個尚無班次的日期按「安排班次」；選同公司員工與班別→「送交主管發布」。切人資主管→待辦開該班次→「發布」→「確認」。切員工→「我的打卡」下方「我的班表」。", "result": "員工看到發布班次；草稿不冒充已發布結果。"}, {"say": "再回到剛才請假的那一天。假設名字還排在這裡，但他有兩小時請假，系統會提醒這個重疊。主管就知道那兩小時要再確認誰接，不是看到名單有人就放心，也不是整天都算他沒來。", "action": "切回人資，選剛才請假的日期→「查看崗位安排」，指「排班無衝突」「請假衝突」「尚無已發布班次」「需確認人力」。"}, {"say": "像只請兩小時，要處理的是這兩小時的人力安排，不會直接認定整天缺勤。班表是安排，打卡是實際到離時間，工作回報則是做了什麼，這三件事分開。"}, {"ask": "哪些崗位一定要維持最低人數、部分時間請假怎麼補人，請現場主管用實際情況幫我們核對。", "qid": "attendance"}], "tag": "操作逐字稿", "tips": []}, {"id": "exchange", "title": "換代班：接班人同意，主管核准才換班", "role": "員工 → 接班人 → 授權主管", "route": "attendance&tab=exchanges", "steps": [{"say": "員工臨時有事，要找同事代班，最怕的是一邊以為講好了，另一邊其實還沒答應。所以我們讓接班人先確認，再交主管核准；最後班表才更新。大家看的是同一個結果。", "action": "員工→「換班與代班」→「申請換代班」，選自己的已發布班次、接班人與原因。代班可用「林雅文」；互換需再選對方的有效班次。按「送交接班人」。"}, {"say": "我切到接班人。對方可以同意，也可以說無法接班。這樣不會出現員工自己不知道，班表就被排過去了。", "action": "點接班人的工作台，或上方切同一人；按「同意接班」→填說明→「確認」。若要演示婉拒，先「無法接班」，再由原申請人修改重送。"}, {"say": "接班人同意後，才交給有權限的主管核准。這次也修正了處理人選擇，會避開當事人和無權處理的主管。", "action": "按目前處理人的工作台→「核准並更新班表」→填審核說明→「確認」。", "result": "班表改為接班人，申請保留同意與核准紀錄。"}, {"say": "如果接班人當時已經請假，或班次本身有衝突，核准就會被擋住，需要退回重新安排。這樣不會一邊說已請假，一邊又把他排去上班。", "action": "回可視化班表與崗位安排核對結果。若顯示衝突，主管退回，原申請人改同一筆重送；不要繞過提示。"}, {"say": "另外，如果原本的假後來不用請了，要從假單申請銷假，走完審核後，請假標記和剩餘額度才會更新。如果班已經換給別人，這件事也要另外協調；銷假不會自己把已核准的換代班撤銷。", "action": "換代班結果看完後，示範另一種情況「原本的假不用請了」：回「假勤申請」找原核准假單→切原員工→「申請銷假」→填原因／交接、儲存草稿→「送出申請」。按單據顯示的處理人依序複核、核准。回同一天班表，再看員工假期餘額。", "result": "已銷假的請假不再列為有效缺勤；額度回補，原申請與銷假紀錄都保留。"}], "tag": "操作逐字稿", "tips": ["用無已核准請假的接班人。若前面已取消原請假，請先確認現在班表和人力條件。", "換代班更新的是班表。崗位人員是否跟著更換，仍由主管核對，不會偷偷改掉原崗位安排。"]}, {"id": "clock", "title": "打卡與補卡：記錄到離時間，異常再審核", "role": "員工 → 人資主管 → 員工", "route": "attendance&tab=clock", "steps": [{"say": "打卡是記錄上班和下班，不代表那天的所有工作都已完成。我先用這個互動版展示記錄方式。", "action": "員工→「我的打卡」。按畫面顯示的「上班打卡」或「下班打卡」，看當日紀錄。", "result": "互動版留下示例打卡紀錄；不把它說成現場 GPS／照片驗證成功。"}, {"say": "定位和現場照片是正式打卡入口的設定。今天這個頁面先讓大家看動線，真實裝置、定位範圍和拍照，另外做現場驗證。", "action": "指「使用正式打卡」入口及定位／照片規則即可；為免中斷分享，不必現場離開示例去要求設備權限。"}, {"say": "如果漏打卡，員工要補日期、時間和原因，主管看過才成為正式的考勤紀錄。", "action": "按「申請補卡」，選已發生且沒有相同打卡的日期／類型／時間，填原因送出。切授權主管→待辦→核准或退回→填審核說明→確認。", "result": "核准後「考勤紀錄」多一筆有補卡來源的紀錄；退回不先補入。"}, {"say": "要補資料時，也是在原單修改重送。月底會把這些還沒完成的項目一起列出來，避免漏了就直接結算。"}], "tag": "操作逐字稿", "tips": []}, {"id": "staffing", "title": "崗位與工作回報：有人排班，也要知道事情做完沒有", "role": "人資／主管 → 被指派員工 → 驗收主管", "route": "attendance&tab=staffing", "steps": [{"say": "這裡再把人力和工作分開。崗位安排是在確認這一天、這個區域需要幾個人；工作回報是在確認安排的事情有沒有完成。", "action": "人資→「崗位人力」→「新增崗位需求」，填日期、工作區、崗位、需求人數與安排人員→「送交主管」。"}, {"say": "主管核對人力和衝突後再發布，不是填了名單就代表人力足夠。", "action": "切另一位授權主管，從待辦開崗位安排，核對後按「核准發布」→填審核說明→「確認」；需要補充則「退回修改」。", "result": "崗位狀態與人力核對更新，仍可看到衝突來源。"}, {"say": "接著工作可以指派給實際執行的人。員工回報完成，主管再驗收；打卡、排班和工作完成都有自己的依據。", "action": "到「工作回報」→「指派工作」，選可切換的員工，填日期、區域及工作內容。切該員工→「回報完成」→填說明。切另一位主管→「驗收通過」或「退回補充」，填說明確認。", "result": "待辦從執行人移到驗收人，完成後留下回報與驗收紀錄。"}], "tag": "操作逐字稿", "tips": []}, {"id": "closing", "title": "月底：先處理異常，再鎖定結果", "role": "人資專員 → 人資主管", "route": "attendance&tab=months", "steps": [{"say": "到月底，人資比較花時間的往往是找漏掉的紀錄：這個人少打一次卡，那張申請還沒回來。這頁先把沒有處理完的項目列出來，照著補完再送主管，不用等到做薪資的時候才回頭追。", "action": "人資→「考勤月結」→月份選 2026-10→「載入月份」。核對待處理項目。", "result": "有未決申請或未處理異常時不能送審；已結束且有資料的月份才可結算。"}, {"say": "人資先核對，再交另一位主管確認。這個月鎖定後，前面的資料就不能隨便回改。", "action": "待核對與待審均為 0：按「送交主管審核」→填「核對／審核說明」→確認。切人資主管→「核准並鎖定」→填說明→確認。", "result": "狀態已鎖定，保留本次月結結果。"}, {"say": "如果之後真的要更正，要先說明原因重新開啟，再修正、重新送審。原來那一版會留著，查得到為什麼改。", "action": "人資主管按「重新開啟月份」→寫原因→確認；看已保留的版本數。", "result": "重開後原月結版本還在，不是刪掉重算。"}, {"ask": "月底誰核對、誰最後確認，以及哪些工時交給財務計薪，請人資和財務一起定。打卡參考工時不直接等於最後的薪資工時。", "qid": "attendance"}], "tag": "操作逐字稿", "tips": []}, {"id": "performance", "title": "考核第一步：先確認工作與比重", "role": "人資主管 · 許嘉寧 → CEO", "route": "performance", "steps": [{"say": "考核如果到最後才問「你這個月表現幾分」，員工和主管很容易各想各的。所以先把要做的工作、做到什麼算完成、哪一項比較重要寫清楚，之後再拿實際成果來評。", "action": "人資主管→「考核管理」。優先用林雅文的待操作草稿；沒有就「新增考核」，考核員工選林雅文。填名稱、期間、每項滿分 100。"}, {"say": "這是工作項目的比重。像工作完成、文件品質和交接回應，各占多少，先在這裡講清楚。", "action": "編輯目標：工作完成 50%、文件品質 30%、交接回應 20%；各填完成標準→「儲存目標草稿」→「送 CEO 確認」→視窗「送出」。", "result": "目標比重合計 100%；送出後交上層確認。"}, {"say": "另外還有評核人的比重，這跟工作項目比重不同。例如主管的分數占多少、上層的分數占多少，要另外確認。", "action": "切 CEO→同一考核「設定本期比重」→主管 60%、CEO 40%→「儲存比重」。再按「確認目標」，重新開啟確認視窗並按「確認目標」。", "result": "本期目標、滿分與合成比重固定保存；之後改設定不回改本期。"}], "tag": "操作逐字稿", "tips": ["林雅文是本次被考核人，最後要切「人資專員」查看本人結果；不要切錯成林小安。", "數字只用來演示。若沿用其他目標與滿分，要一起調整後面的示例分數。"]}, {"id": "performance-result", "title": "考核第二步：分層評分，員工看得到結果怎麼算", "role": "人資主管 → CEO → 人資專員 · 林雅文", "route": "performance", "steps": [{"say": "主管評分時，要有實際成果和依據。下一層看得到前面的內容，才能確認分數是否合理。", "action": "人資主管→同一份「填寫主管評分」；三項填 80、90、85，每項填成果依據，再填整體評語→「送 CEO 評核」。"}, {"say": "如果依據不夠，上層可以退回補充。補完再送，不會把原先的紀錄直接消失。", "action": "CEO 可先「退回補充評分」，填「請補充文件品質的具體依據」→退回主管。人資主管補原評分再送；CEO「填寫 CEO 評核」，三項填 85、92、88、各項依據與整體評語→「完成評核」。"}, {"say": "員工拿到結果，不只看到一個總分。他可以看到哪一項比較好、哪一項要改善，還有主管寫的原因。面談時就能照著這些內容談，比只說「這次表現要加強」更清楚。", "action": "切「人資專員 · 林雅文」→考核管理→「考核結果」→同一份「查看考核結果」，展開兩層評語與處理紀錄。", "result": "若使用前段的同一組數字：主管 84、CEO 87.7，合成總分 85.48。"}, {"ask": "考核的項目、標準、比重、週期，以及哪些能用數據計算，還需要跟董總和各部門主管確認。先以一個實際職務做完整範例，再套到其他職務。", "qid": "kpi"}], "tag": "操作逐字稿", "tips": ["未設定合成比重時，系統保留兩層分數，不自行套公式；結果不自動調薪。"]}, {"id": "tasks", "title": "行政交辦：申請、指派、回報、驗收", "role": "人資專員 → 人資主管 → CEO → 人資主管 → 員工 → 人資主管", "route": "tasks", "steps": [{"say": "像整理一批文件、安排一次交接，事情交出去了，過幾天又要問做到哪裡，這種就適合放進來。有負責人、有期限，完成後能回報。很小的口頭交代，則不一定都要多填一張表。", "action": "人資專員→「專案交辦」→「新增交辦申請」，填「會議示範｜文件交接」、期限與成果，複核人選許嘉寧、核准人選 CEO→儲存草稿。"}, {"say": "先確認這件事要不要做，再指派誰做。提出人、複核人和核准人分開。", "action": "人資「送交主管複核」→填說明→確認；人資主管複核；CEO「核准交辦」。每層都從待辦開同一筆並填說明。"}, {"say": "核准後，主管再指定執行人和里程碑。員工回報成果，最後由另一個人驗收。", "action": "人資主管→「指派工作」，選林雅文或尚在行政職務的林小安，里程碑填「整理文件」「確認接手人」。切該執行人→「回報里程碑」，勾完成並填說明→「提交驗收」。人資主管→「驗收通過」或「退回改善」。", "result": "未完成全部里程碑不能送驗收；完成後留回報、退回與驗收紀錄。"}, {"ask": "行政交辦哪些值得追、哪些用原本溝通方式就夠，請給我們兩三個實際例子，避免多一套重複登錄。", "qid": "tasks"}], "tag": "操作逐字稿", "tips": ["這段安排在人事調部門之前，避免員工已調工程後不在行政指派選單。若已調動，改選林雅文，後面就切人資專員回報。"]}, {"id": "personnel", "title": "人事異動：送審完成，到了日期才生效", "role": "人資專員 → 人資主管 → CEO → 人資專員 → 員工", "route": "personnel", "steps": [{"say": "假設員工要從行政轉到工程，先把從哪一天開始、新職務是什麼確認好，再照流程生效。不是送出一張申請，就馬上換權限。人資和主管都查得到，他從哪一天開始做哪一份工作。", "action": "人資→「人事異動 → 部門／職務調整」，用林小安尚未送審的草稿；若已有完成紀錄先查目前職務，不重送相同調整。"}, {"say": "我先由人資填新職務、生效日期和原因，再送給人資主管複核。", "action": "「填寫申請」→工程部／工程助理、生效日 2026-11-04、異動原因→「儲存草稿」→「送交人資主管複核」→視窗再次確認。"}, {"say": "人資主管複核後送 CEO 核准。這時只是核准待生效，還不會立刻讓員工多出另一個部門的權限。", "action": "人資主管「複核通過 → CEO」→視窗「複核通過」；CEO「核准異動」→同名確認；回人資查看「已核准・待生效」。"}, {"say": "這次補了一個修正入口。如果核准後發現日期或內容需要調整，人資可以重新送審，舊核准失效並留紀錄，重新確認後才生效。", "action": "人資可按「重新送審」看原因欄位。若實作重送，填原因，修改草稿後完整再走複核及核准；不示範這支線則取消視窗。"}, {"say": "最後由人資確認生效。我再切到員工，現在能看到工程工作；人資也能從生效紀錄回看前後的改變。", "action": "人資「確認生效與權限變更」→「確認異動生效」；看「生效紀錄」。切林小安，看工程入口，再接後面的工程段。", "result": "部門職務變更與生效歷史一致；未到生效日會阻擋。"}], "tag": "操作逐字稿", "tips": []}, {"id": "personnel-types", "title": "其他人事異動：每種類型都有自己的申請", "role": "人資專員 → 人資主管 → CEO → 人資專員", "route": "personnel", "steps": [{"say": "其他異動也不是只有一個說明按鈕。每一種類型都可以從填寫開始，再經複核、核准到生效。", "action": "依序開「新進到職、試用轉正、跨公司調動、離職與交接、復職」。每類選自己的草稿與示例人物，不拿同一人同時演多種互相衝突的異動。"}, {"say": "新進到職要確認員工基本資料、部門職務和到職日；轉正要確認試用結果和生效日；復職則確認原員工的新任職安排。", "action": "到職用林宥辰；轉正用王子晴；復職用郭怡君。各類：修改草稿→儲存→送交複核→人資主管複核→CEO 核准→人資確認生效。查看各自的前後差異。"}, {"say": "跨公司調動要明確寫接收公司。只是去另一個項目支援，跟真正變更任職公司不同，不能混在一起。", "action": "跨公司調動用陳柏宇，確認 KYD → ZEUS、接收部門及生效日，照同一路線走完，再看前後資料。", "result": "原任職來源與新公司資訊留在異動紀錄；這是示例，不代表已開通真實跨公司帳號。"}, {"say": "離職還要交代交接內容和生效日。調薪則另外交由財務處理，不是一般人資權限就能看到所有人的金額。", "action": "離職與交接用張可晴，補交接清單再走完整流程。調薪由財務開李承恩的草稿→CEO 複核→董事長核准→財務確認生效；與一般異動的路線分開。"}, {"ask": "實際的生效確認人、離職停用和跨公司支援範圍，需要依現行名冊及權限表核對。今天先讓大家把各類操作走清楚。", "qid": "employment"}], "tag": "操作逐字稿", "tips": ["本段提供每種類型的完整接力；會議若逐筆實做，從上方段落選單回本段即可，不要為節省時間直接把狀態改成完成。", "一般人資畫面不應出現調薪金額；要看調薪才切財務。"]}, {"id": "engineering", "title": "工程：工作指派、進度回報與驗收", "role": "工程主管 → 工程員工 → 工程主管", "route": "engineering", "steps": [{"say": "工程這邊常常同時有好幾件事在跑。主管先看哪一件還沒完成、哪一件逾期、哪一件等驗收；再進去找負責人和回報，不用每件事都從聊天紀錄重新問一次。", "action": "切工程主管→「工程與專案」→既有「示例工程｜共享辦公區改善」→「開啟專案」。不要新建空專案來展示文件和預算。"}, {"say": "主管可以新增工作、指定承辦人、完成期限及檢查項目。員工只回報自己負責的工作，不會因為可以看專案就能改所有預算。", "action": "「新增工作」→名稱「會議示範｜圖面核對」、承辦人選已調工程的林小安、期限、兩項檢核點及說明→儲存。"}, {"say": "我切成承辦員工，先回報進度，再把完成的工作送驗收。做到百分之百，跟主管驗收通過，是兩個不同階段。", "action": "切林小安→同一專案／工作「更新進度」，填 100%、勾完所有檢核點、寫說明；「這次操作」選「回報完成，交主管驗收」→「儲存進度」。", "result": "工作變待驗收，主管待辦出現驗收項目。"}, {"say": "主管看完可以驗收，也可以退回改善。前一次回報和改善的紀錄都留下來。", "action": "工程主管→「驗收／退回」，先選退回改善並寫原因→「確認驗收」；員工補充重送後，主管再選驗收通過。", "result": "已驗收的工作計入專案結果，承辦人不能自行驗收自己回報的工作。"}], "tag": "操作逐字稿", "tips": ["林小安若仍是行政職務，要先完成前段部門／職務異動；選人欄位不會為方便展示而列所有人。"]}, {"id": "engineering-files", "title": "工程文件、預算與變更：最新版清楚，舊版可追", "role": "工程主管", "route": "engineering", "steps": [{"say": "工程如果有人用舊圖、有人用新圖，後面就容易做錯。所以同一個專案的文件放在一起，先讓大家知道現在用哪一版；需要追之前怎麼改的，也找得到舊版。", "action": "同一專案→「相關文件」→「查看最新版」→關閉→「版本紀錄」→查看舊版。需要演示更新時，主管「登記新版示例」，填內容與修改說明。"}, {"say": "預算也保留原提供人的表和版本，不是把一個數字放上來，就當作已付款或重新估價。", "action": "「預算與費用」→「打開預算表」，展示來源、版本及分類。", "result": "預算表與工作進度分開；金額不代表已入帳或已付款。"}, {"say": "工程有變更，就記原因、對費用和工期的影響。這裡先保留變更資料，不會登記一下就自動核准加錢。", "action": "「工程變更」→「登記變更」，填主旨、原因、費用影響、工期影響與備註→「儲存變更紀錄」。再看「修改／撤回」和版本歷史。"}, {"ask": "工程後續是否要接請款、需要哪些附件和核准人，請工程與財務一起確認。現階段先把工作、文件和變更追清楚。", "qid": "tasks"}], "tag": "操作逐字稿", "tips": ["文件內容是示例預覽，不說已上傳真實圖檔；工程變更現階段沒有自動預算核准／付款流程。"]}, {"id": "procurement", "title": "採購：需求、複核、核准、到貨分開", "role": "工程主管 → 財務 → CEO → 原申請人 → 財務", "route": "procurement", "steps": [{"say": "採購從需要買什麼開始，先寫用途、供應商、品項和金額。供應商資料留在採購裡，不再另外增加一個左側選單。", "action": "工程主管→「採購作業」→既有草稿或「新增採購申請」，填用途、供應商、品項數量單價與說明→儲存→「送交財務複核」→確認。"}, {"say": "我切財務核對，再切 CEO 核准。需要補充時，退回原申請人修改同一筆，不要重新建好幾張。", "action": "財務→同一單「複核通過」→視窗填說明／確認；CEO「核准採購」→確認。示範退回時先回原工程主管補充重送。"}, {"say": "對財務來說，主管說可以買了，跟東西真的收到了，是兩件事。這裡把到貨和驗收留下來，後面處理帳務時，就不用只靠一句「應該已經收到了」去猜。", "action": "切原申請人→「登記到貨驗收」，填驗收結果→確認；切財務→「建立相關傳票」或已有的「查看相關傳票」。", "result": "採購狀態已到貨驗收；傳票仍是另行處理的草稿，不重複建帳。"}], "tag": "操作逐字稿", "tips": ["目前示例路線是工程主管→財務→CEO，不說所有正式採購都已設定好分層制度。", "傳票的審核入帳接財務段；在確認正式財會承接方式前，不擴大成自動付款承諾。"]}, {"id": "training", "title": "培訓：報名、出席、證照連在一起", "role": "人資專員 → 員工 → 人資專員 → 員工", "route": "training", "steps": [{"say": "如果要確認誰上過某個課，這裡可以直接查課程和參加人。人資比較不用另外找一份報名表，再問現場那天誰真的有來。", "action": "人資→「培訓與獎懲 → 課程」→「新增課程」。要當場連續示範報名和出席，課程日期設示例基準日 2026-11-04，填名稱、地點、講師、內容後儲存。"}, {"say": "員工可以從自己的畫面報名，人資再確認出席。報名和真的上完課是分開記的。", "action": "切員工→新課「報名課程」。切人資→同課「登記出席」→「登記／修改出席」→選出席狀態並儲存。", "result": "人資看到報名者；完成出席登記後課程狀態更新。"}, {"say": "需要保存證照或完成紀錄時，再登錄核發單位和期限，員工也能查看自己的紀錄。", "action": "人資→「證照」→「登錄證照」，填員工、名稱、核發單位、日期、編號、期限→儲存；切該員工→「查看證照」→「預覽示例證明」。", "result": "出席與證照各有紀錄，不把示例證明當正式外部證照。"}], "tag": "操作逐字稿", "tips": ["未來日期的課程只能先看報名，還不能登記出席。要連續展示就按本段用示例基準日。"]}, {"id": "conduct", "title": "表揚、違紀與申覆：有依據，也有回應機會", "role": "人資專員 → 人資主管 → 員工 → 人資主管", "route": "training&tab=commendation", "steps": [{"say": "表揚或違紀也要留清楚的原因和獨立確認，不是某個人登記後就直接變成定案。", "action": "人資→「表揚」→「新增表揚」，選示例員工、日期、主題、原因與佐證→儲存→「送交複核／送交獨立複核」→填說明→確認。"}, {"say": "我切人資主管看資料，能核定，也能退回補充。違紀的登記也走同樣的獨立確認。", "action": "人資主管→同筆「核定紀錄」或「退回補充」→填說明→確認。若示範違紀，用「違紀」中的示例，不針對真實員工填寫指控。"}, {"say": "員工如果對自己的違紀紀錄有需要補充的地方，可以提出申覆；處理人再查核並留下回覆。", "action": "切員工→本人已核定的違紀紀錄→「提出申覆」，填理由與佐證→送出；人資主管→「申覆」→「回覆申覆」，填查核結果→「記錄回覆」；切員工查看回覆。", "result": "原紀錄與申覆、回覆一起保留，不自動扣薪或修改考核。"}, {"ask": "哪些紀錄由誰登記、誰核定，以及申覆怎麼處理，需要人資提供目前做法，我們再對齊。", "qid": "training"}], "tag": "操作逐字稿", "tips": []}, {"id": "salary", "title": "薪酬與社保：分公司編製，員工只看自己的結果", "role": "財務 → CEO → 董事長 → 財務 → 員工", "route": "salary&source=example", "steps": [{"say": "薪資要先按任職和發薪公司分開，員工支援另一個項目，不會自動改成另一家公司發薪。這裡先展示編製、核對和確認的流程。", "action": "切財務→「薪酬與社保」，確認選「功能操作示範」→「薪資設定」查看組成，再開「計薪批次」。只用示例金額。"}, {"say": "財務先核對這個月的人員和金額，再交上層複核與核准。核准後仍要由財務確認薪資單，員工才看到自己的結果。", "action": "選未完成批次，例如 2026-11；已完成則「新增計薪批次」選未使用月份。用「調整項目」核對金額→「送交 CEO 複核」；CEO「複核通過」；董事長「核准批次」；財務「確認薪資單」。各步填處理說明並確認。", "result": "批次變薪資單已確認；不等於已執行銀行轉帳。"}, {"say": "員工如果想確認自己的薪資明細，可以直接看自己的那一張；財務不用每次都另外整理回覆。別人的薪資不會因為同在一個部門，就一起開放給他看。", "action": "切員工→「薪酬與社保／我的薪資單」→該月份「查看薪資明細」。"}, {"say": "社保也能留下月份、金額和繳納參考紀錄。正式費率、扣款和計薪規則仍要由人資、財務確認，今天先看資料怎麼交接。", "action": "切財務→「社保紀錄」，選已確認月份→「登記繳納紀錄示例」，看收據參考與日期欄位；確認這只是記錄，不執行申報或付款。"}], "tag": "操作逐字稿", "tips": ["加班、假勤扣款與社保金額目前是手動示例，不能說已完整自動連動考勤計薪。"]}, {"id": "finance", "title": "財務會計：先保留操作方向，等董總確認承接方式", "role": "財務專員", "route": "accounting", "steps": [{"say": "財務這一塊，董總之前提的科目、傳票、總帳和報表需求，我都保留著。今天先讓大家看資料如何分公司、如何經過確認，不會因為我們現在把畫面做出來，就直接當成已經取代正式會計系統。", "action": "財務→「財務會計」，展示目前公司的科目、傳票與報表入口；再指明公司選擇。"}, {"say": "這幾天董總比較忙，財務這部分我還在等她回覆。主要要確認，是由 ERP 整理單據後交給會計、跟現有或成熟的會計系統串接，還是真的由我們承接完整財會。"}, {"say": "我們希望先把正式帳本放哪裡、誰來核對、要哪些報表講清楚。選定方式後，再請財務或會計用正確範例一起驗收，這樣才不會兩邊各做一份，最後數字對不起來。"}, {"say": "我接著用一筆示例傳票帶流程，只是讓大家看建單、複核、核准和入帳怎麼分工。正式範圍仍等確認。", "action": "下一段可接完整傳票操作；若會議只需要說明財會方向，可用段落選單直接到「董事長看到的畫面」。"}], "tag": "這一段請照著說 · 財務範圍仍待回覆", "tips": ["不在台上說董總已同意自建完整財會，也不說財務模組已取消。", "待確認頁保留需要董總回覆的內容，會後再補，不要求不在場者當場作決定。"]}, {"id": "finance-flow", "title": "財務示例：傳票到入帳，再看報表", "role": "財務 → CEO → 董事長 → 財務", "route": "accounting", "steps": [{"say": "一開始只是草稿，還不進帳。每筆資料要先有公司、日期和科目，借貸也必須平衡。", "action": "用待操作傳票或「新增傳票」：參考號「MEETING-1112」、日期 2026-11-04，借方一般費用 100、貸方應付帳款 100，填摘要後儲存。若已有同參考號，沿用原單，避免重複建。"}, {"say": "財務送出後，先由 CEO 複核，再由董事長核准，最後仍回財務確認入帳。核准跟真正入帳是不同動作。", "action": "財務「送交複核」→填說明／同名確認；CEO「複核通過」→填說明→「複核傳票」；董事長「核准傳票」→填說明／確認；財務「確認入帳」→填說明／確認。", "result": "只有已入帳的收入費用科目才進管理看板。這筆是費用／應付，不代表銀行付款。"}, {"say": "入帳後可以追到分錄、總帳和報表。需要更正時，要留下原帳和沖回的關係，不是直接把舊數字改掉。", "action": "查看同筆分錄，再開總帳、試算與報表，選包含該日期的期間。示範更正可按「建立沖回傳票」，形成新草稿後重新走審核入帳；不要為了展示直接刪原單。"}, {"say": "大量資料可以先預覽匯入，確認欄位與錯誤再建立草稿；關帳也要先核對未完成單據。正式的科目表和匯入格式，要請財務提供。", "action": "展示「檢查與匯入 CSV」及「下載 CSV」；只用去識別的示例，預覽不等於入帳。關帳入口先看檢查結果，未完成單據先處理，不強行鎖定。"}], "tag": "操作逐字稿", "tips": ["這是現有示例操作，不是會計正確性或在地法規的正式驗收。"]}, {"id": "dashboard", "title": "董事長看到的畫面：先掌握重點，再追來源", "role": "董事長；再對照 CEO／部門主管", "route": "home", "steps": [{"say": "前面我們看的是大家怎麼做事。現在換成董事長。如果每次要了解公司近況，都要一個一個問部門，就很難很快看出重點。這個畫面先把各部門狀況和需要注意的事情放在前面，有疑問再往下看。", "action": "上方選「董事長」→「工作首頁」。使用預設「管理總覽」，不用點任何以個人姓名命名的捷徑。"}, {"say": "這裡先彙總收入、費用、人員、考核和工程狀況。董事長不用一進來就看所有表單，但看到有疑問的地方，可以往下點回來源。", "action": "統計週期選「本月」，截止日期選 2026-11-04→「更新總覽」。依序指財務大類、需關注事項、各部門近況、工程進度。", "result": "數字來自目前示例已完成的紀錄；不同狀態不混算。"}, {"say": "像剛才完成的考核、已驗收的工程，以及已入帳的費用，就能回到這裡對照。財務只用已入帳資料，不能把還在申請的錢當成收入或支出。", "action": "點「考核結果」「工作與里程碑」或「核對帳務來源」之一，開原資料後返回首頁。"}, {"say": "不同公司仍分開看。我們也會再跟董事長確認，最常看的三到五個重點是什麼，把那些放在最前面，其他細節交給主管處理。", "action": "如要展示另一公司，從上方切公司，再按期間更新。對照各公司已入帳摘要，不把不同幣別直接合併。"}, {"say": "CEO 可能會接著追：這件事卡在哪裡、誰來處理；部門主管則要知道：今天誰能上班、哪件工作要趕、哪些申請等我確認。所以會依職務，把常用的內容放前面，不讓每個人都先面對一大堆相同的表單。", "action": "切 CEO→工作首頁；再切工程主管→工作首頁。示範「我的工作與申請」仍能回到本人工作。"}, {"ask": "董事長，您最希望第一眼看到哪三到五件事？比較常按公司、項目，還是部門看？哪些異常需要特別提醒您？", "qid": "deng"}], "tag": "會後重點 · 統一稱董事長畫面", "tips": ["口頭和本稿都只稱「董事長」。CEO 仍是另一個審核角色，勿混稱。", "目前管理總覽並沒有每個部門的全部即時 KPI；以畫面實際的部門人數、請假、考核完成及工程摘要說明。要新增哪些指標請現場確認。"]}, {"id": "settings", "title": "報表與設定：權限、提醒和操作紀錄", "role": "人資主管；必要時系統管理員", "route": "access", "steps": [{"say": "最後這一區是管理設定和核對。人力報表讓主管看人員分布，權限則把每個角色能看、能做的範圍分開。", "action": "人資主管→「報表與設定」→「人力報表」→「角色與權限」，對照部門與職務。"}, {"say": "證件多久前提醒、幾天再跟進，可以在這裡調整。發生過哪些操作，也能回看紀錄，方便查問題。", "action": "「提醒設定」→「修改提醒設定」展示欄位，尚未決定則取消；「操作紀錄」查看剛才流程。"}, {"say": "這裡也保留員工資料匯入前的欄位檢查，先找出對應錯誤，避免直接把不正確的資料塞進去。", "action": "「匯入預覽」→「欄位對應」→「預覽資料」。只使用內建兩筆示例，展示公司／部門／姓名欄位，最後「完成預覽」。", "result": "此入口只記錄預覽結果，不把兩筆假員工匯入真實名冊。"}, {"say": "正式的細分權限仍需要一張確認過的表，像能看、能新增、能複核、能核准、能匯出，要分開列。今天切換示例角色，是讓大家看出差異，不是每個正式帳號都能自己任意換角色。"}], "tag": "操作逐字稿", "tips": []}, {"id": "mobile", "title": "手機與語言：同樣能接手自己的工作", "role": "員工／主管", "route": "home", "steps": [{"say": "手機版也保留同樣的操作邏輯。員工可以從手機提出申請，主管可以看自己的待辦，並不是手機只有幾張不能操作的畫面。", "action": "若方便，另開手機版網址；分享時仍以電腦畫面為主。手機點上方姓名／角色卡→選角色，再從底部「待辦」進對應單據。"}, {"say": "切換角色後，會進那個角色的首頁；再從待辦找到同一筆工作接著處理。正式使用時，就由不同帳號各自處理自己的步驟。", "action": "展示手機角色選單、待辦、模組與鈴鐺。若手機沒有電腦剛才的單，是不同瀏覽器各自的示例資料，不要說已同步。"}, {"say": "語言目前保留繁體中文、英文和高棉文，可以切換看看哪一種比較方便使用。實際表單上的用語，後續也請使用同事幫忙核對。", "action": "用右上語言選單切 English，再切 ខ្មែរ，最後切回繁中。"}], "tag": "操作逐字稿", "tips": ["手機講稿不會遙控電腦。若直接展示手機操作，另用該裝置上的同一筆流程接續；不要當場承諾跨裝置即時同步。"]}, {"id": "pms", "title": "ERP 與 PMS：操作範圍清楚，彙整方式保留彈性", "role": "管理層", "route": "pms", "steps": [{"say": "今天我帶的是 ERP 這邊的人事、內部協作、工程採購和公司管理流程。物業、租約、維修及客訴，由 Richard 接著說明 PMS 的部分。", "action": "開「前往 PMS」入口，展示範圍說明；目前沒有確認的 PMS 連結就停在說明頁。"}, {"say": "排班考勤目前在 ERP 的互動版裡可以操作。後面如果沿用既有考勤工具，或要跟 PMS 交換資料，還是可以討論；重要的是人員、公司和需要的結果能對得起來。"}, {"say": "看板可以彙整重要資料，但不代表每個子系統都一定要重做在同一個地方。實際怎麼串接、哪些資料由哪一邊提供，我再跟 Richard 對齊。"}], "tag": "操作逐字稿", "tips": []}, {"id": "wrap", "title": "收尾：請大家確認使用方式，制度逐項補齊", "role": "切回董事長或人資總覽", "route": "home", "steps": [{"say": "今天這一輪，大家可以想一下：平常哪些事情是靠訊息一直追，哪些是到月底才發現漏了，哪些是不知道該找誰。我們希望把這些事情放到清楚的位置，讓下一位知道輪到他做什麼，最後也找得到結果。"}, {"say": "接下來我希望請實際會使用的人再走一次，告訴我哪一步跟現在工作不一樣、哪些欄位沒有必要、哪些資訊應該提早看到。我們用實際操作來確認，不只看畫面好不好看。"}, {"say": "還需要確認的，主要是准假和簽呈權限、假別與餘額規則、考核項目和比重、各角色可看的公司與部門，以及董事長看板的優先資訊。財務承接方式則等董總方便回覆後，再跟財務一起確認。"}, {"say": "今天能確認的，我會整理進紀錄；還需要資料的，就先留下提供人和時間。接下來請 Richard 接著說明 PMS 的部分。"}], "tag": "收尾 · 約 1 分鐘", "tips": []}], "questions": [{"id": "approval", "title": "准假與簽呈，究竟由誰簽？", "owner": "董總", "basis": "上次會議明列", "priority": true, "ask": "董總，我們先照您現行的准假、簽呈表來做。可以請您指定一位同事提供最新版，讓我們核對各部門是誰先簽、誰後簽，以及哪些只要一層、哪些要兩層或三層嗎？", "items": ["按公司、部門、申請種類區分：請假、銷假、加班、外勤是否同一條路線？", "主管自己申請時，交給哪一位？不要出現自己審自己。", "代理、退回補件、跨部門／跨公司情境怎麼處理；這些以現行制度補齊。"], "takeaway": "取得一份有效版本的簽核表：適用情境、簽核職務／人、層數、代理與生效日。", "chapter": "leave-relay"}, {"id": "kpi", "title": "不同職務，考核什麼、怎麼算？", "owner": "董總＋各部門主管", "basis": "上次會議明列", "priority": true, "ask": "董總，考核這塊我想優先跟您對。每個職務要評哪些工作、怎樣算達成、各占多少？哪些由主管判斷，哪些可以依實際數據計分？", "items": ["先挑一個職務試做完整範例：項目、標準、目標比重合計 100%。", "分開確認「工作項目比重」與「評核人比重」；不把示例的主管 60%、CEO 40% 直接當制度。", "誰訂目標、誰確認目標、誰評分、誰最後確認？多久評一次？", "員工能看哪些結果，有疑義怎麼反映？自動計分需哪個資料來源、公式與例外規則？"], "takeaway": "一個職務的完整考核表範例，加上週期、評核人、計分方式與結果可見範圍。", "chapter": "performance"}, {"id": "scope", "title": "人資與主管各看哪些人、做哪些事？", "owner": "董總＋行政人事＋各主管", "basis": "上次會議明列", "priority": true, "ask": "這張全員總表，哪些職務可以看全公司，哪些只能看自己部門？同一批人管理幾家公司時，誰可以跨公司查，誰只能處理其中一部分？", "items": ["按公司／部門／職務，分開列「查看、填寫、修改、複核、核准、匯出」。", "同是人資，也確認是否有人只管考勤、有人管考核或證件；薪資與個人證件明細另授權。", "總表要哪些欄位、哪些異常，是否保留核對人與核對紀錄？", "主管代理期間及人事異動生效後的權限變化，列為實施時補齊的細節。"], "takeaway": "一張職務權限表，先確認實際人員與所管公司／部門，並由使用者核對總表欄位。", "chapter": "overview"}, {"id": "leave", "title": "假別、事由、年假餘額怎麼管理？", "owner": "董總＋行政人事；IAN 核對規定", "basis": "上次會議明列", "priority": true, "ask": "法定假別由我跟人資核對適用規定；公司另外的福利假，以及請假事由、證明和年假計算，請您跟人資提供現行做法，讓我們逐項對。", "items": ["各假別的適用對象、給薪方式、佐證要求；國定假日／例假與員工請假分開。", "會中提到每月增加 1.5 天：從哪天起算、哪些人適用、每一天換算幾小時、年底如何結轉？", "不足額、送審預留、撤回、銷假核准後的回補，分別在哪個時間點更新？", "跨月／跨年申請如何拆分；補問資料缺漏由誰確認，不讓同一筆重複計入。"], "takeaway": "最新版假勤制度與餘額表範例；法規核對事項另列，不請現場以口頭決定取代適用規定。", "chapter": "balance"}, {"id": "finance", "title": "財務會計的承接方式｜待董總回覆", "owner": "董總＋財務；IAN／Richard 對接", "basis": "延續董總前次需求；本次確認做法", "priority": true, "ask": "財務的原有需求保留。董總這幾天較忙，這部分仍待她回覆：由 ERP 整理單據交會計、串接成熟工具，或由我們承接完整財會。確認後再請財務／會計一起提供樣本和驗收口徑。", "items": ["先確認既有需求是否仍完整適用：各公司科目與帳冊、傳票、總帳、損益、資產負債、期初、匯入匯出、防錯和修改權限。不是重新問「到底有沒有財務需求」。", "現在使用什麼工具、由公司內部財務或外部會計做帳？哪些資料重複輸入，最想先解決哪一步？", "三種做法可討論：ERP 整理業務單據並匯出給會計；ERP 串接既有／成熟會計系統並帶回報表；或由我們另建完整財會。畫面整合不代表底層一定全部自建。", "不論採哪種方式，哪裡是正式帳本？誰建單、複核、核准、入帳、關帳與更正？避免兩邊各自修改後對不起來。", "請指定財務／會計共同核對科目、正確範例、報表結果與必要的在地要求。未完成這些核對，不把示例稱為可直接做正式帳的系統。", "請提供現行科目表、期初表、去識別交易、傳票及報表樣本；再確認來源公司、薪資／PMS 交換資料，以及高層收入費用分類。"], "takeaway": "確認財會承接範圍、現有工具、正式帳本來源、財務驗收人及樣本提供日；先定需求與分工，再選實作方式。", "chapter": "finance"}, {"id": "deng", "title": "董事長看板，先看哪些重點？", "owner": "董事長；董總協助財務分類", "basis": "上次會議明列", "priority": true, "ask": "董事長，您進系統最想先看到哪三到五個數字或狀況？希望按公司、項目還是事業單位看？我們先把您的重點排出來。", "items": ["候選例子：收入／費用大類、人力、工作進度、考核、工程待驗收；請董事長選擇，不直接當成全部必需。", "日、週、月哪個最常看？資料需要多久更新一次？", "哪些異常要突出，哪些明細交給相關主管處理？", "哪些公司／單位納入；資料由 ERP、PMS 或其他系統提供，由 IAN 與 Richard 後續核對。"], "takeaway": "一份看板優先清單：指標、公司／單位、統計期間、更新頻率、異常條件及授權範圍。", "chapter": "dashboard"}, {"id": "training", "title": "培訓、表揚與違紀，實際怎麼辦？", "owner": "董總＋行政人事", "basis": "上次會議明列", "priority": false, "ask": "培訓與獎懲上次有先展示，但細項還沒跟您對。公司現在如何安排培訓、確認出席和證照？表揚或違紀由誰登記、誰確認？", "items": ["哪些課程必修、哪些自行報名；出席及完成條件怎麼認定？", "表揚、違紀與申覆的處理人及可見範圍。", "是否與考核有關，以及如何連結，需要先確認，不能自動扣分或調薪。"], "takeaway": "現行表單或一個實際案例，加上辦理人、審核人與員工查看範圍。", "chapter": "training"}, {"id": "tasks", "title": "哪些交辦要記？工程需要做到哪裡？", "owner": "董總＋行政／工程負責人", "basis": "上次會議明列", "priority": false, "ask": "行政交辦這邊，我不想增加大家重複登錄的工作。哪些事情需要追期限、交接和驗收，值得放進系統？工程這邊哪些文件、變更、請款需要一起追？", "items": ["請提供兩三件「需要追蹤」的行政工作，並說明哪些口頭交辦不必登錄。", "工程保留自己的工作、文件版本、分類、預算、變更與驗收；不要和行政交辦混成一種。", "工程是否需要請款流程、誰審、要帶哪些資料，另行確認。"], "takeaway": "行政納管／不納管的例子，以及工程必需功能與請款邊界。", "chapter": "tasks"}, {"id": "documents", "title": "證件提醒與總表的使用規則", "owner": "行政人事＋董總核定範圍", "basis": "總表方向已提出；細節補問", "priority": false, "ask": "證件這邊，請人資幫我核對每類證件適用哪些人，還有提早幾天提醒、提醒誰。這樣未登錄或到期的提示，才不會把不適用的人也算進去。", "items": ["各類證件的適用對象、必填資料與完整性判定。", "到期前提醒天數、重複提醒頻率、承辦人與收件人。", "本人、主管、人資各能看清單還是能看文件內容；保存與續辦紀錄要求。", "是否需要 Email／推播另確認；目前只能展示已做的站內提醒。"], "takeaway": "證件適用清單、提醒規則與收件人；不要把「未登錄」直接等同違規。", "chapter": "documents"}, {"id": "attendance", "title": "排班、換代班、月結與資料串接", "owner": "現場主管＋人資／財務＋Richard", "basis": "可視化方向已定；作業與串接補問", "priority": false, "ask": "排班操作先從 ERP 這邊看。接下來要請現場主管確認每天哪些崗位需要幾人，請假或換代班由誰處理；資料怎麼跟原有考勤配合，我再跟 Richard 對。", "items": ["崗位最低人力、夜班／跨日、部分時段請假與補人規則。", "換代班誰同意、跨部門支援誰核准，班表與崗位名單由誰一起核對？", "月結誰核對、誰確認、何時截止，鎖定後誰可重開；跨月時數和計薪口徑要對齊。", "與 Richard 確認原有考勤是否沿用、資料從哪裡來、員工／公司識別、更新頻率及異常處理。部署與介面形式仍保留彈性。"], "takeaway": "排班與月結負責人、規則範例；IAN／Richard 另整理資料對接表。", "chapter": "schedule"}, {"id": "employment", "title": "跨公司支援、異動與薪資權限", "owner": "董總＋人資＋財務", "basis": "延續既有需求；實施細節補問", "priority": false, "ask": "同一批人支援不同公司，我們把服務範圍和任職、發薪公司分開。請幫我確認各自的歸屬，以及異動何時生效、哪些人能看到薪資。", "items": ["員工在哪家公司任職／發薪、可以支援哪些公司或項目，逐項沿用已確認名冊核對。", "新進、轉正、調部門、調薪、離職由誰提出、複核、核准與確認生效。", "職務權限生效日期、離職停用及代理到期如何處理。", "薪資項目、個別薪資可見範圍、財務定稿與員工薪資單，另由授權人提供正式資料。"], "takeaway": "歸屬與支援範圍表、各類異動權限／生效規則，以及薪資資料授權人。", "chapter": "personnel"}, {"id": "next", "title": "確認後，誰先試、用什麼驗收？", "owner": "董總／指定主管＋IAN＋Richard", "basis": "下一步執行補問", "priority": false, "ask": "確認完這些規則後，我們先找實際會操作的人試。請問由哪位人資、主管和財務對接？先走哪幾筆工作，做到什麼程度就算通過？", "items": ["把今天未定的問題留下負責人與預計提供日期；先取得規則／表單，不用當場猜。", "試用包含提出、退回修改、複核、核准、結果回到總表，不只看畫面。", "PMS 的計帳、結算與外部介面由 Richard 帶後續討論；ERP 留好資料交換需求。", "下一階段試用、驗收與正式上線日期，由雙方確認後記錄。"], "takeaway": "一份有對接人、資料提供日、試用案例與驗收安排的待辦清單。", "chapter": "wrap"}]}</script>
<script>
(()=>{'use strict';const {chapters,questions}=JSON.parse(document.getElementById('content-data').textContent),KEY='kyd-full-runthrough-20261112';

const $=s=>document.querySelector(s);const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(KEY+k))??d}catch{return d}};const save=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v));return true}catch{return false}};

$('#script-panel').innerHTML=chapters.map((c,i)=>`<article id="chapter-${c.id}" class="script-chapter" hidden><div class="eyebrow">${esc(c.tag)}</div><h1>${esc(c.title)}</h1><p class="role">${esc(c.role)}</p>${c.intro?`<p class="intro">${esc(c.intro)}</p>`:''}${c.actions?`<ol class="prep-list">${c.actions.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:''}${(c.steps||[]).map(s=>`${s.action?`<div class="block operation"><div class="label">電腦操作 · 不用念</div><p>${esc(s.action)}</p></div>`:''}${s.say?`<div class="block speech"><div class="label">我說</div><p>${esc(s.say)}</p></div>`:''}${s.result?`<div class="block result"><div class="label">應該看到 · 不用念</div><p>${esc(s.result)}</p></div>`:''}${s.ask?`<div class="block ask"><div class="label">停一下 · 請現場確認</div><p>${esc(s.ask)}</p><a href="#q=${s.qid}">這題的完整核對清單 →</a></div>`:''}`).join('')}${c.tips?`<details class="tips" ${i===0?'open':''}><summary>給 IAN 的提醒 · 不用念</summary><ul>${c.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}<div class="links">${c.route?`<a class="button" href="https://clutchlab-ai.github.io/kyd-erp-web/demo/#view=${esc(c.route)}" target="_blank" rel="noopener">電腦操作入口 ↗</a>`:''}${i!==0?'<a class="button" href="#s=prepare">查看會前準備</a>':''}</div>${i===0?'<p class="small">這份是講者筆記。手機點操作入口只會開另一個網頁，不會控制電腦；切角色示範請在電腦進行。</p>':''}</article>`).join('');
$('#questions-panel').innerHTML=`<div class="q-intro"><div class="eyebrow">現場討論 · 把規則與對接人定下來</div><h1>會議要留下的確認事項</h1><p class="intro">先核對 6 個重點：簽核、考核、資料範圍、假勤、財務承接方式，以及董事長看板。財務待董總回覆；其他細項可請指定同事補資料。</p><p class="small">「上次會議明列」是已留下的討論主題；每題內的操作細節，是為了實際建置再展開核對，不表示每一條都是與會者原話或已定案。</p><div class="filters" aria-label="篩選問題"><button data-filter="priority" aria-pressed="true">今天優先 · 6 題</button><button data-filter="all" aria-pressed="false">完整清單 · 12 題</button><button data-filter="dong" aria-pressed="false">董總相關</button><button data-filter="deng" aria-pressed="false">董事長看板</button><button data-filter="richard" aria-pressed="false">Richard 對接</button></div><p class="small" id="filter-count"></p></div>`+questions.map((q,i)=>`<article class="q-card" id="q-${q.id}" data-q="${q.id}"><div class="q-meta"><span>${String(i+1).padStart(2,'0')}</span><span class="pill">${esc(q.basis)}</span></div><h2>${esc(q.title)}</h2><p class="q-owner">請 ${esc(q.owner)} 確認</p><div class="q-say"><div class="label">可以直接這樣問</div><p>${esc(q.ask)}</p></div><details class="q-detail"><summary>需要問清楚的細項</summary><ul>${q.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><div class="takeaway"><strong>這題要留下的結果</strong><br>${esc(q.takeaway)}</div><a class="back-link" href="#s=${q.chapter}">回對應操作段落 →</a><details class="q-notes"><summary>記下答案／資料提供人</summary><label>討論狀態<select data-status="${q.id}"><option value="pending">待討論</option><option value="confirmed">已確認</option><option value="followup">會後補資料</option></select></label><label>答案、對接人、預計提供日<textarea data-note="${q.id}" placeholder="例如：由＿＿提供最新版權限表，預計＿＿前給。"></textarea></label></details></article>`).join('')+`<footer class="doc-end"><p>筆記只儲存在目前瀏覽器，不會上傳或同步給與會者。需要保留時可下載文字檔。</p><div class="toolbar-bottom"><button class="button" id="export-notes">下載確認筆記</button><button class="button" id="print-all">列印完整稿</button><a class="button" href="https://clutchlab-ai.github.io/kyd-erp-web/meeting-notes/2026-11-12/flow-check.html" target="_blank" rel="noopener">最新修正與操作說明 ↗</a></div><p class="status-line" id="save-status" role="status"></p><p>統整 2026-11-04 會議至 2026-11-12 改動與目前操作版。IAN 報告用。</p></footer>`;
document.querySelectorAll('[data-status]').forEach(el=>{el.value=notes[el.dataset.status]?.status||'pending';el.onchange=()=>setNote(el.dataset.status,'status',el.value)});
document.querySelectorAll('[data-note]').forEach(el=>{el.value=notes[el.dataset.note]?.text||'';el.oninput=()=>setNote(el.dataset.note,'text',el.value)});
function setNote(id,k,v){notes[id]??={};notes[id][k]=v;const ok=save('-notes',notes);$('#save-status').textContent=ok?'已儲存在此瀏覽器。':'瀏覽器無法保存，請先下載筆記。'}
function applyFont(){document.documentElement.style.setProperty('--speech',font+'px');$('#font-down').disabled=font<=20;$('#font-up').disabled=font>=29;save('-font',font)}
$('#font-down').onclick=()=>{font=Math.max(20,font-3);applyFont()};$('#font-up').onclick=()=>{font=Math.min(29,font+3);applyFont()};applyFont();
function allowed(q){return filter==='all'||filter==='priority'&&q.priority||filter==='dong'&&q.owner.includes('董總')||filter==='deng'&&q.id==='deng'||filter==='richard'&&['attendance','finance','next'].includes(q.id)}
function applyFilter(){let count=0;questions.forEach(q=>{const show=allowed(q);$('#q-'+q.id).hidden=!show;if(show)count++});document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===filter));$('#filter-count').textContent=`目前顯示 ${count} 題。未定案的題目，先記提供資料的人與日期。`}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;applyFilter();if(location.hash.startsWith('#q='))history.replaceState(null,'','#questions')});
function route(scroll=true){const hash=location.hash.slice(1),isQuestion=hash==='questions'||hash.startsWith('q=');allMode=hash==='all';$('#script-panel').hidden=isQuestion;$('#questions-panel').hidden=!isQuestion;$('#tab-script').setAttribute('aria-current',isQuestion||allMode?'false':'page');$('#tab-all').setAttribute('aria-current',allMode?'page':'false');$('#tab-questions').setAttribute('aria-current',isQuestion?'page':'false');$('.footer-nav').hidden=isQuestion||allMode;$('#chapter-select').hidden=isQuestion;document.body.classList.toggle('all-mode',allMode);
if(isQuestion){if(hash.startsWith('q=')){filter='all';applyFilter();const target=$('#q-'+hash.slice(2));if(target){target.querySelector('.q-detail').open=true;if(scroll)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}))}else if(scroll)window.scrollTo(0,0)}else{applyFilter();if(scroll)window.scrollTo(0,0)}}else{const id=hash.startsWith('s=')?hash.slice(2):'opening';index=Math.max(0,chapters.findIndex(c=>c.id===id));document.querySelectorAll('.script-chapter').forEach((el,i)=>el.hidden=!allMode&&i!==index);$('#chapter-select').value=chapters[index].id;$('#page-count').textContent=index===0?'會前準備':`${index} / ${chapters.length-1}`;$('#progress-fill').style.width=(index/(chapters.length-1)*100)+'%';$('#previous').disabled=index===0;$('#next').disabled=index===chapters.length-1;if(scroll)window.scrollTo(0,0);save('-last',chapters[index].id)} }
$('#chapter-select').onchange=e=>{location.hash='s='+e.target.value};$('#previous').onclick=()=>{if(index>0)location.hash='s='+chapters[index-1].id};$('#next').onclick=()=>{if(index<chapters.length-1)location.hash='s='+chapters[index+1].id};
window.addEventListener('hashchange',()=>route());window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey||!$('#questions-panel').hidden)return;if(e.key==='ArrowRight'&&index<chapters.length-1){e.preventDefault();$('#next').click()}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();$('#previous').click()}});
$('#export-notes').onclick=()=>{const labels={pending:'待討論',confirmed:'已確認',followup:'會後補資料'};const text=['2026-11-12 KYD ERP｜確認筆記','',...questions.flatMap((q,i)=>[`${i+1}. ${q.title}`,`對接：${q.owner}`,`狀態：${labels[notes[q.id]?.status||'pending']}`,`需留下：${q.takeaway}`,`記錄：${notes[q.id]?.text||'尚未記錄'}`,''])].join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='2026-11-12_KYD_ERP_確認筆記.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
let beforePrint=[];window.addEventListener('beforeprint',()=>{beforePrint=Array.from(document.querySelectorAll('details')).map(d=>d.open);document.querySelectorAll('.q-card,.script-chapter').forEach(el=>el.hidden=false);document.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>{document.querySelectorAll('details').forEach((d,i)=>d.open=beforePrint[i]||false);route(false)});$('#print-all').onclick=()=>window.print();route(false);
})();
</script></body></html>
