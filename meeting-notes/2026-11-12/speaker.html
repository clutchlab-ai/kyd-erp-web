<script id="content-data" type="application/json">{"chapters": [{"id": "prepare", "title": "開始前，先準備好", "tag": "只給 IAN 看 · 不用念", "role": "電腦用同一個瀏覽器操作", "intro": "手機看這份稿，電腦開 ERP 示例。兩個畫面各做各的，不需要同步。", "actions": ["電腦開啟 /demo/，選繁體中文與 KYD。手機只開這份逐字稿。要接續同一筆申請，角色都在電腦的同一個瀏覽器裡切換。", "先切人資，找到一位可切換身分的示例員工，記住他的姓名、部門，以及一個已發布班次的日期。原始案例是林小安、2026-11-04；如果之前已調職或改過班表，以現在畫面為準。", "請假示範用該班次內的兩小時，例如 10:00–12:00。先確認年假可用額度，以及當天沒有重複請假。沒有適合班次，就先由人資安排，再交另一位有權限的主管發布。", "先看該員工適用的請假路線。以下用「員工 → 人資主管 → CEO」帶操作；實際路線不同，就依畫面上的下一位處理人切換，不要讓工程主管審行政部員工。", "考核挑一筆尚未送審的目標草稿，記住員工與直屬主管。若原案例已完成，可用主管的「新增考核」另建一筆；不要改掉既有結果。", "會前完整試走一次。示例系統日期固定為 2026-11-04，與今天會議日期不同；正式員工名冊不用重匯，也不用清除原有資料。"], "tips": ["時間有限時，先走人事總覽、請假接力、班表、考核與鄧總看板。月結、人事異動和其他業務可按現場問題加看。", "下面灰藍色是電腦操作提醒；白底「我說」是可以直接念的內容；淡黃色是停下來請大家確認。"], "route": "home"}, {"id": "opening", "title": "今天先看能怎麼用", "tag": "開場 · 約 1 分鐘", "role": "人資專員", "steps": [{"say": "各位主管好，我今天先帶大家看一下，從上次會議到現在，ERP 調整了哪些地方。這次我會直接操作，讓大家看到一件事情從員工提出，到主管處理，最後結果怎麼回來。"}, {"say": "這一週主要補了三件事：第一，人資跟主管能先看到整體狀況；第二，請假、排班和餘額能對得起來；第三，管理層先看重點，有需要再進去看明細。"}, {"say": "今天用示例資料走流程。原本的員工與公司資料保留，畫面裡的示範流程不會去改正式名冊。"}, {"say": "上次也有幾項作業規則，還需要跟董總核對。今天我會在相關畫面停一下，請大家告訴我實際怎麼做，我們再把規則套進去。"}], "tips": ["這次可說「8 組會後新增或調整，另外修正 3 類問題」。不用逐一念數量；不要把原本保留的模組都說成這週新做。"], "route": "hr-overview"}, {"id": "overview", "title": "人資先看全部，再查明細", "tag": "重點示範 · 約 2 分鐘", "role": "人資專員 → 人資主管／部門主管", "steps": [{"action": "切人資專員，進「工作首頁／人事管理總覽」。選公司、月份；指給大家看完整人員清單與異常。", "say": "上次提到，主管不能只看到等著簽核的單子，還要知道整個團隊現在是什麼狀況。所以這裡補了一張總表。誰的證件要處理、誰的假還沒審、誰的打卡要核對，都可以先從這裡找。"}, {"action": "點一位員工的來源明細，再返回總表。展示原月份與篩選條件仍保留。", "say": "看到有問題，可以直接進去看原始資料，處理完再回來。還沒有登錄資料的人也會列出來，這樣比較容易發現漏了誰。"}, {"action": "切部門主管，看名單範圍；再切回人資主管。", "say": "同一套系統，不同職務看到的範圍會不一樣。部門主管先看自己負責的人，人資看授權管理的人；能看、能改、能簽核，也會分開。"}, {"ask": "董總，這張總表您希望人資專員、人資主管、各部門主管分別看到哪些人？哪些可以跨公司看，哪些只能看自己部門？", "qid": "scope"}], "tips": ["這週也補了來源明細、選人欄位和待辦的範圍檢查，避免首頁有限制，點進去卻又看到其他部門。正式授權人名仍待確認。"], "route": "hr-overview"}, {"id": "documents", "title": "證件到期，要看得到也追得到", "tag": "重點示範 · 約 2 分鐘", "role": "人資專員", "steps": [{"action": "進「證件與合約 → 全員證件總表」。選一筆到期、即將到期或未登錄項目。", "say": "這裡保留大家上次覺得清楚的做法：先看全部人的狀況，再點開個別證件。勞動合約、護照、工作許可、簽證，能一起核對。"}, {"action": "打開證件明細與續辦紀錄。若要實作，登記「已提醒補件」或「續辦中」，填下一次跟進日期與說明；不要為了展示亂改到期日。", "say": "到期變紅只是提醒我們要處理。真正要留下的是：誰去聯絡、現在辦到哪裡、下一次什麼時候跟進。收到新證件以後，舊紀錄也留著。"}, {"say": "這週也修正了總數：已被新證件取代的舊件，不會再算成目前到期的件數。這樣主管看總表，跟點進明細看到的才會一致。"}, {"ask": "人資這邊請幫我確認：哪些人需要哪些證件、提早幾天提醒、提醒本人還是也提醒主管？", "qid": "documents"}], "tips": ["目前可示範站內提醒。Email 和手機推播還沒有接通，不要說已經會寄出通知。"], "route": "documents&tab=overview"}, {"id": "leave-start", "title": "請假，從員工自己提出開始", "tag": "流程 1／2 · 約 2 分鐘", "role": "員工", "steps": [{"action": "切準備好的示例員工 →「假勤申請」→「新增請假」。", "say": "接下來我用同一筆請假，帶大家看不同角色怎麼接手。員工從這裡提出申請，不用另外找一張表，再到處問現在簽到誰。"}, {"action": "選年假；填已準備班次的日期、10:00–12:00、2 小時。事由填「個人事務」；交接先填「已交接」。儲存草稿，再按「送出申請」。記住單號。", "say": "員工填假別、時間、事由和交接安排。需要佐證的假別，也可以留佐證連結。送出之後，這一筆就會交給下一位處理人。"}, {"action": "指給大家看狀態、下一位處理人及處理紀錄。", "say": "現在重點是，員工知道已經送出，主管也有自己的待辦。不是每個人都在同一個畫面按同一顆按鈕。"}], "tips": ["日期和時數以已準備好的班次為準；不要現場硬用會議當天。佐證目前是連結欄位，不要說所有檔案上傳都已完成。"], "route": "leave"}, {"id": "leave-relay", "title": "退回、補件、複核、核准", "tag": "流程 2／2 · 約 3 分鐘", "role": "目前處理人 → 員工 → 各層主管", "steps": [{"action": "依單據的「切換查看處理人」，切到目前主管。打開同一單號，按「退回修改」；原因填「請補充交接人與待辦事項」。", "say": "如果主管覺得資料不夠，就退回並寫清楚原因。員工看到的是要補哪裡，不是只收到一個不同意。"}, {"action": "切回原申請人 → 同一筆 →「修改內容」。交接改成「已與當班同事確認，由同事接手來電與文件收件；回來後接續處理」。儲存，再「送出申請」。", "say": "員工補充後，重送同一筆。前面送過、退回過的紀錄都留著，不用重新建一張，大家也不用猜哪一版才是現在的。"}, {"action": "切第一位複核人 → 同一筆 →「複核通過」。再依下一位處理人切換；最後一層按「核准」。切回員工查看結果。", "say": "資料完整後，照設定的順序逐層處理。最後核准，結果會回到員工這邊。誰在什麼步驟處理過，也查得到。"}, {"ask": "董總，上次有提到有些只簽一層，有些兩層或三層。我們就以您現行的准假、簽呈權限表為準。請問可以由哪一位提供最新版，再一起核對各部門由誰簽嗎？", "qid": "approval"}], "tips": ["不是每一筆都一定送 CEO。這裡只是示範接力；正式層數與人員依董總核定。"], "route": "leave"}, {"id": "balance", "title": "請假結果，回到全員總表", "tag": "接著同一筆 · 約 1 分鐘", "role": "人資主管", "steps": [{"action": "切人資主管 → 人事管理總覽 →「每月年假總表」。選剛才那位員工與請假月份。", "say": "請假核准以後，人資不用再另外抄一份。這張表可以看月初有多少、本月增加多少、用了多少，還有多少在等待審核。"}, {"action": "對照同一筆請假的已休、待審與可用餘額。", "say": "如果送審時已經先預留額度，核准時就是轉成已休，不會再重複扣一次。需要銷假時，也要經過處理，核准後才把額度補回。"}, {"ask": "董總、行政人事同事，年假的起算、結轉、請假中的預留方式，請幫我核對現行做法。假別本身會由我跟人資核對適用規定，公司另外給的福利假再分開設定。", "qid": "leave"}], "tips": ["每月 1.5 天是會中提過的做法；適用對象、起算、每日時數還要核對，不在現場說成已完成法律確認。"], "route": "hr-overview&tab=leave"}, {"id": "schedule", "title": "班表看得出誰不在、人夠不夠", "tag": "接著同一筆 · 約 2 分鐘", "role": "人資／授權主管", "steps": [{"action": "進「排班與考勤 → 可視化班表」，選剛才請假的日期。看當天班次與已核准請假。", "say": "上次蔡董提到，排班要用看得懂的方式呈現。現在可以從月曆選一天，看到誰有班、誰請假，不用在不同清單裡自己拼。"}, {"action": "點「查看崗位安排」，看「排班無衝突」「請假衝突」「尚無已發布班次」「需確認人力」。", "say": "人有排進名單，不代表這段時間一定能上班。所以這次把幾種情況分開：沒有正式班次、請假撞到班次，或還需要補人。主管就知道下一步要確認什麼。"}, {"say": "像剛才只請兩小時，代表這兩小時要處理，不會直接當成整天沒來。換代班後，班表會更新；崗位要不要跟著換人，還是要由負責主管核對。"}, {"ask": "現場主管，這樣看一天的班和缺口夠清楚嗎？哪些崗位一定要維持最低人數，誰可以決定找人代班？", "qid": "attendance"}], "tips": ["這是排班與請假的衝突核對，不等於實際出勤判定。GPS、相機及真實設備今天不在這條示範流程裡驗收。"], "route": "attendance&tab=calendar"}, {"id": "closing", "title": "月底先核對，再確認結果", "tag": "可選加看 · 約 1 分鐘", "role": "人資專員 → 人資主管", "steps": [{"action": "進「排班與考勤 → 考勤月結」，選已結束且有資料的月份，例如示例的 2026-10。", "say": "到了月底，要先把沒處理完的假、補卡和異常核對清楚，再確認這個月的結果。這裡會列出還有哪些事情沒完成。"}, {"action": "先看未決單據與異常。不需要為了展示而全部勾掉；只有已核對、無阻擋時，才由人資「送交主管審核」，再由另一位授權主管「核准並鎖定」。", "say": "確認以後會留一份當時的結果。之後如果要更正，需要重新開啟並留下紀錄，不能悄悄把已確認的月份改掉。"}, {"ask": "月底由誰核對、誰確認？跨月請假怎麼分配，哪些工時最後交給薪資使用？這部分我再跟人資和財務一起對。", "qid": "attendance"}], "tips": ["打卡參考工時不等於最後計薪工時。跨月時數未拆好時會標示待處理；不要說已經自動算好所有薪資。"], "route": "attendance&tab=months"}, {"id": "performance", "title": "考核先講清楚，再看分數", "tag": "重點示範 · 約 3 分鐘", "role": "該員工直屬主管 → CEO → 主管 → CEO → 員工", "steps": [{"action": "切該筆考核的直屬主管 →「考核管理」→ 準備好的草稿 →「編輯目標」。", "say": "考核這邊，最重要的是先知道要評什麼，而不是先做出一個分數。主管先寫要完成的工作、怎樣算達成，每個項目占多少。"}, {"action": "示範三項目標，例如工作完成 50%、文件品質 30%、交接回應 20%，合計 100%。儲存目標草稿，再「送 CEO 確認」。", "say": "這是第一種比重：不同工作各占多少。我這裡的數字只是示範，實際要照職務分開訂。"}, {"action": "切 CEO，打開同筆 →「設定本期比重」。可示例主管 60%、CEO 40%；儲存後重新開「確認目標」並確認。", "say": "另外還有一種比重，是不同評核人的分數各占多少。這跟前面的工作項目比重是兩件事，要分開講清楚。本期確認後，就保留本期的設定。"}, {"action": "切直屬主管 →「填寫主管評分」，每項填分數、成果依據及整體評語 →「送 CEO 評核」。切 CEO 填第二層評核並完成，再切該員工看「考核結果」。", "say": "評分時要寫依據。最後員工能看到各項結果，以及分數怎麼組合，不是只看到一個總分。這個結果也不會直接把薪水改掉。"}, {"ask": "董總，這一塊我想優先跟您對：不同職務評什麼、各占多少、哪些由主管給分，哪些有客觀數據可以計算？誰最後確認結果？", "qid": "kpi"}], "tips": ["考核評分項目、50/30/20 與 60/40 均為示例，不是公司已定制度。若沒有設定合成比重，就保留兩層分數，不硬算一個總分。"], "route": "performance"}, {"id": "personnel", "title": "人員調動，核准與生效分開", "tag": "可選加看 · 約 2 分鐘", "role": "人資專員 → 人資主管 → CEO → 人資專員", "steps": [{"action": "進「人事異動」，由人資建立部門／職務調整。選可切換角色的示例員工，填新部門、新職務、生效日與原因，儲存、送審。", "say": "像一位員工調到工程部，人資先提出調整，主管複核、核准之後，還要確認什麼時候正式生效。"}, {"action": "切人資主管處理同一筆，再切 CEO 核准；回人資依可生效日期確認生效。最後切該員工看選單變化。", "say": "生效之後，對應的工作範圍才跟著變。不是表單剛填完，人就立刻多出另一個部門的權限。"}, {"say": "另外，同一批人支援不同公司的業務，不代表薪水就要換公司發。工作支援範圍和任職、發薪公司，我們會分開處理。"}, {"ask": "董總，這部分我想再跟人資核對：誰決定生效、誰可以調整權限，以及跨公司支援時，各自可以處理哪些工作。", "qid": "employment"}], "tips": ["會影響示例員工後續畫面，建議排在請假示範之後。未到生效日不能硬按生效；正式名冊不受示例異動影響。"], "route": "personnel"}, {"id": "finance", "title": "各公司分帳，原有模組也保留", "tag": "簡述 · 約 2 分鐘", "role": "財務專員；需要時切工程主管", "steps": [{"action": "切財務 →「財務會計」，選公司，看傳票清單、借貸分錄和報表。", "say": "財務這邊仍然是各公司分開看帳。同一個人可能服務幾個單位，但每筆帳屬於哪家公司，要明確留著。草稿、審核和正式入帳也分開。"}, {"action": "若需要走完整流程：財務建借貸平衡的傳票草稿並送出 → CEO 複核 → 董事長核准 → 財務入帳。使用示例資料。", "say": "現在畫面已經可以走建單、複核、核准、入帳。正式誰簽、用哪些科目、最後要哪一種報表，我們會照您跟財務提供的版本調整。"}, {"ask": "董總，請問現行科目表、傳票和匯出報表，可以由哪位財務提供樣本？高層看的收入、費用，您希望先分成哪幾大類？", "qid": "finance"}, {"say": "原本的工程、採購、薪資、培訓也都保留。工程裡的工作進度、文件版本、預算與變更驗收還在；這次沒有因為先講人事，就把其他模組拿掉。"}, {"ask": "另外，培訓獎懲的細節，以及哪些行政交辦真的需要進系統，上次還沒定。這兩項我也列好了，請相關主管給我們實際例子。", "qid": "training"}], "tips": ["此處的財務審核路線是保留的示例，尚待正式授權表核定。報表只計已入帳資料；沒有真的付款或串銀行。"], "route": "accounting"}, {"id": "dashboard", "title": "鄧總先看重點，再決定追哪裡", "tag": "重點示範 · 約 2 分鐘", "role": "管理層示例 → 鄧總專屬 Dashboard", "steps": [{"action": "切 CEO／董事長等管理層示例 → 工作首頁 →「鄧總專屬 Dashboard」。選單日、近七日或本月，再選公司。", "say": "鄧總，這一頁是另外為您整理的管理總覽。您先看到各單位的重要數字、進度和需要關注的事情，有問題再請負責主管往下查。"}, {"action": "依序指收入費用大類、部門狀況、考核與工程進度。不要逐筆打開單據。", "say": "例如財務先看收入、費用和大類；團隊看人員與工作狀況；工程看進度和待驗收。日常每張單據由相關主管先處理，這裡讓您比較快知道哪裡需要問。"}, {"ask": "鄧總，如果每天只先看三到五個重點，您最想看哪些？是各公司的收支、工程進度、人力狀況，還是其他指標？", "qid": "deng"}, {"ask": "您平常比較想看每天、每週，還是每月的結果？哪些異常需要特別提醒您？", "qid": "deng"}, {"say": "我們先把要看的內容確認清楚，再跟 Richard 對需要從 PMS 帶回來的資料。子系統可以分開運作，重要資訊能彙整回來就好。"}], "tips": ["鄧總與董總是不同的人。這是鄧總看板示例入口，不代表鄧總正式帳號與權限已開通；目前不是 PMS 即時資料。"], "route": "home&dashboard=deng"}, {"id": "wrap", "title": "收尾：把規則與下一步定下來", "tag": "收尾 · 約 1 分鐘", "role": "停止操作，回到討論", "steps": [{"say": "我這邊先示範到這裡。這次改動的重點，是讓人資先看到完整狀況，讓每一筆申請知道下一步交給誰，讓請假、班表和管理總表能連在一起。"}, {"say": "董總這邊，我想先確認五件事：簽核權限、考核規則、資料可見範圍、假勤制度，以及財務要用的表格。鄧總這邊，先確認管理總覽最重要的幾個指標。"}, {"say": "如果今天有些細節需要再查資料也沒關係，我們就先記下由誰提供、什麼時候可以給。我會依確認的版本調整，再請實際操作的人試一次。"}, {"say": "排班考勤和 PMS 的資料關係，我再跟 Richard 對齊。接下來就交給 Richard 說明 PMS 的部分。"}], "tips": ["需要逐項問時，切上方「待確認」。完成試用、驗收與正式上線日期另行確認，不在這裡承諾尚未核定的日期。"], "route": ""}], "questions": [{"id": "approval", "title": "准假與簽呈，究竟由誰簽？", "owner": "董總", "basis": "上次會議明列", "priority": true, "ask": "董總，我們先照您現行的准假、簽呈表來做。可以請您指定一位同事提供最新版，讓我們核對各部門是誰先簽、誰後簽，以及哪些只要一層、哪些要兩層或三層嗎？", "items": ["按公司、部門、申請種類區分：請假、銷假、加班、外勤是否同一條路線？", "主管自己申請時，交給哪一位？不要出現自己審自己。", "代理、退回補件、跨部門／跨公司情境怎麼處理；這些以現行制度補齊。"], "takeaway": "取得一份有效版本的簽核表：適用情境、簽核職務／人、層數、代理與生效日。", "chapter": "leave-relay"}, {"id": "kpi", "title": "不同職務，考核什麼、怎麼算？", "owner": "董總＋各部門主管", "basis": "上次會議明列", "priority": true, "ask": "董總，考核這塊我想優先跟您對。每個職務要評哪些工作、怎樣算達成、各占多少？哪些由主管判斷，哪些可以依實際數據計分？", "items": ["先挑一個職務試做完整範例：項目、標準、目標比重合計 100%。", "分開確認「工作項目比重」與「評核人比重」；不把示例的主管 60%、CEO 40% 直接當制度。", "誰訂目標、誰確認目標、誰評分、誰最後確認？多久評一次？", "員工能看哪些結果，有疑義怎麼反映？自動計分需哪個資料來源、公式與例外規則？"], "takeaway": "一個職務的完整考核表範例，加上週期、評核人、計分方式與結果可見範圍。", "chapter": "performance"}, {"id": "scope", "title": "人資與主管各看哪些人、做哪些事？", "owner": "董總＋行政人事＋各主管", "basis": "上次會議明列", "priority": true, "ask": "這張全員總表，哪些職務可以看全公司，哪些只能看自己部門？同一批人管理幾家公司時，誰可以跨公司查，誰只能處理其中一部分？", "items": ["按公司／部門／職務，分開列「查看、填寫、修改、複核、核准、匯出」。", "同是人資，也確認是否有人只管考勤、有人管考核或證件；薪資與個人證件明細另授權。", "總表要哪些欄位、哪些異常，是否保留核對人與核對紀錄？", "主管代理期間及人事異動生效後的權限變化，列為實施時補齊的細節。"], "takeaway": "一張職務權限表，先確認實際人員與所管公司／部門，並由使用者核對總表欄位。", "chapter": "overview"}, {"id": "leave", "title": "假別、事由、年假餘額怎麼管理？", "owner": "董總＋行政人事；IAN 核對規定", "basis": "上次會議明列", "priority": true, "ask": "法定假別由我跟人資核對適用規定；公司另外的福利假，以及請假事由、證明和年假計算，請您跟人資提供現行做法，讓我們逐項對。", "items": ["各假別的適用對象、給薪方式、佐證要求；國定假日／例假與員工請假分開。", "會中提到每月增加 1.5 天：從哪天起算、哪些人適用、每一天換算幾小時、年底如何結轉？", "不足額、送審預留、撤回、銷假核准後的回補，分別在哪個時間點更新？", "跨月／跨年申請如何拆分；補問資料缺漏由誰確認，不讓同一筆重複計入。"], "takeaway": "最新版假勤制度與餘額表範例；法規核對事項另列，不請現場以口頭決定取代適用規定。", "chapter": "balance"}, {"id": "finance", "title": "財務科目、報表與高層分類", "owner": "董總＋財務；IAN／Richard 對接", "basis": "上次會議明列", "priority": true, "ask": "財務請先給我現行的科目表、傳票和要匯出的報表樣本。高層看到的收入、費用，要先分成哪幾大類，也想請您一起確認。", "items": ["各公司的帳冊、科目、借貸資料與匯入／匯出欄位，按現行版本核對。", "誰建單、誰複核、誰核准、誰入帳／關帳，補齊到正式權限表。", "主畫面看哪些收入與費用大類？以哪個日期／狀態列入統計？", "財務留在 ERP 板塊或獨立系統，部署仍保留彈性；先決定要交換哪些資料。"], "takeaway": "由指定財務提供範本；列出帳務範圍、統計口徑和管理報表大類。", "chapter": "finance"}, {"id": "deng", "title": "鄧總專屬看板，先看哪幾個重點？", "owner": "鄧總；董總協助財務分類", "basis": "上次會議明列", "priority": true, "ask": "鄧總，您進系統最想先看到哪三到五個數字或狀況？希望按公司、項目還是事業單位看？我們先把您的重點排出來。", "items": ["候選例子：收入／費用大類、人力、工作進度、考核、工程待驗收；請鄧總選擇，不直接當成全部必需。", "日、週、月哪個最常看？資料需要多久更新一次？", "哪些異常要突出，哪些明細交給相關主管處理？", "哪些公司／單位納入；資料由 ERP、PMS 或其他系統提供，由 IAN 與 Richard 後續核對。"], "takeaway": "一份看板優先清單：指標、公司／單位、統計期間、更新頻率、異常條件及授權範圍。", "chapter": "dashboard"}, {"id": "training", "title": "培訓、表揚與違紀，實際怎麼辦？", "owner": "董總＋行政人事", "basis": "上次會議明列", "priority": false, "ask": "培訓與獎懲上次有先展示，但細項還沒跟您對。公司現在如何安排培訓、確認出席和證照？表揚或違紀由誰登記、誰確認？", "items": ["哪些課程必修、哪些自行報名；出席及完成條件怎麼認定？", "表揚、違紀與申覆的處理人及可見範圍。", "是否與考核有關，以及如何連結，需要先確認，不能自動扣分或調薪。"], "takeaway": "現行表單或一個實際案例，加上辦理人、審核人與員工查看範圍。", "chapter": "finance"}, {"id": "tasks", "title": "哪些交辦要記？工程需要做到哪裡？", "owner": "董總＋行政／工程負責人", "basis": "上次會議明列", "priority": false, "ask": "行政交辦這邊，我不想增加大家重複登錄的工作。哪些事情需要追期限、交接和驗收，值得放進系統？工程這邊哪些文件、變更、請款需要一起追？", "items": ["請提供兩三件「需要追蹤」的行政工作，並說明哪些口頭交辦不必登錄。", "工程保留自己的工作、文件版本、分類、預算、變更與驗收；不要和行政交辦混成一種。", "工程是否需要請款流程、誰審、要帶哪些資料，另行確認。"], "takeaway": "行政納管／不納管的例子，以及工程必需功能與請款邊界。", "chapter": "finance"}, {"id": "documents", "title": "證件提醒與總表的使用規則", "owner": "行政人事＋董總核定範圍", "basis": "總表方向已提出；細節補問", "priority": false, "ask": "證件這邊，請人資幫我核對每類證件適用哪些人，還有提早幾天提醒、提醒誰。這樣未登錄或到期的提示，才不會把不適用的人也算進去。", "items": ["各類證件的適用對象、必填資料與完整性判定。", "到期前提醒天數、重複提醒頻率、承辦人與收件人。", "本人、主管、人資各能看清單還是能看文件內容；保存與續辦紀錄要求。", "是否需要 Email／推播另確認；目前只能展示已做的站內提醒。"], "takeaway": "證件適用清單、提醒規則與收件人；不要把「未登錄」直接等同違規。", "chapter": "documents"}, {"id": "attendance", "title": "排班、換代班、月結與資料串接", "owner": "現場主管＋人資／財務＋Richard", "basis": "可視化方向已定；作業與串接補問", "priority": false, "ask": "排班操作先從 ERP 這邊看。接下來要請現場主管確認每天哪些崗位需要幾人，請假或換代班由誰處理；資料怎麼跟原有考勤配合，我再跟 Richard 對。", "items": ["崗位最低人力、夜班／跨日、部分時段請假與補人規則。", "換代班誰同意、跨部門支援誰核准，班表與崗位名單由誰一起核對？", "月結誰核對、誰確認、何時截止，鎖定後誰可重開；跨月時數和計薪口徑要對齊。", "與 Richard 確認原有考勤是否沿用、資料從哪裡來、員工／公司識別、更新頻率及異常處理。部署與介面形式仍保留彈性。"], "takeaway": "排班與月結負責人、規則範例；IAN／Richard 另整理資料對接表。", "chapter": "schedule"}, {"id": "employment", "title": "跨公司支援、異動與薪資權限", "owner": "董總＋人資＋財務", "basis": "延續既有需求；實施細節補問", "priority": false, "ask": "同一批人支援不同公司，我們把服務範圍和任職、發薪公司分開。請幫我確認各自的歸屬，以及異動何時生效、哪些人能看到薪資。", "items": ["員工在哪家公司任職／發薪、可以支援哪些公司或項目，逐項沿用已確認名冊核對。", "新進、轉正、調部門、調薪、離職由誰提出、複核、核准與確認生效。", "職務權限生效日期、離職停用及代理到期如何處理。", "薪資項目、個別薪資可見範圍、財務定稿與員工薪資單，另由授權人提供正式資料。"], "takeaway": "歸屬與支援範圍表、各類異動權限／生效規則，以及薪資資料授權人。", "chapter": "personnel"}, {"id": "next", "title": "確認後，誰先試、用什麼驗收？", "owner": "董總／指定主管＋IAN＋Richard", "basis": "下一步執行補問", "priority": false, "ask": "確認完這些規則後，我們先找實際會操作的人試。請問由哪位人資、主管和財務對接？先走哪幾筆工作，做到什麼程度就算通過？", "items": ["把今天未定的問題留下負責人與預計提供日期；先取得規則／表單，不用當場猜。", "試用包含提出、退回修改、複核、核准、結果回到總表，不只看畫面。", "PMS 的計帳、結算與外部介面由 Richard 帶後續討論；ERP 留好資料交換需求。", "下一階段試用、驗收與正式上線日期，由雙方確認後記錄。"], "takeaway": "一份有對接人、資料提供日、試用案例與驗收安排的待辦清單。", "chapter": "wrap"}]}</script>

const notes=read('-notes',{});let allMode=false;
$('#chapter-select').innerHTML=chapters.map((c,i)=>`<option value="${c.id}">${i===0?'準備':String(i).padStart(2,'0')} · ${esc(c.title)}</option>`).join('');
$('#script-panel').innerHTML=chapters.map((c,i)=>`<article id="chapter-${c.id}" class="script-chapter" hidden><div class="eyebrow">${esc(c.tag)}</div><h1>${esc(c.title)}</h1><p class="role">${esc(c.role)}</p>${c.intro?`<p class="intro">${esc(c.intro)}</p>`:''}${c.actions?`<ol class="prep-list">${c.actions.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`:''}${(c.steps||[]).map(s=>`${s.action?`<div class="block operation"><div class="label">電腦操作 · 不用念</div><p>${esc(s.action)}</p></div>`:''}${s.say?`<div class="block speech"><div class="label">我說</div><p>${esc(s.say)}</p></div>`:''}${s.ask?`<div class="block ask"><div class="label">停一下 · 請現場確認</div><p>${esc(s.ask)}</p><a href="#q=${s.qid}">這題的完整核對清單 →</a></div>`:''}`).join('')}${c.tips?`<details class="tips" ${i===0?'open':''}><summary>給 IAN 的提醒 · 不用念</summary><ul>${c.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>`:''}<div class="links">${c.route?`<a class="button" href="https://clutchlab-ai.github.io/kyd-erp-web/demo/#view=${esc(c.route)}" target="_blank" rel="noopener">電腦操作入口 ↗</a>`:''}${i!==0?'<a class="button" href="#s=prepare">查看會前準備</a>':''}</div>${i===0?'<p class="small">這份是講者筆記。手機點操作入口只會開另一個網頁，不會控制電腦；切角色示範請在電腦進行。</p>':''}</article>`).join('');
$('#questions-panel').innerHTML=`<div class="q-intro"><div class="eyebrow">現場討論 · 把規則與對接人定下來</div><h1>董總與鄧總，分開確認</h1><p class="intro">先問 6 個重點：董總的 5 類作業規則，以及鄧總的管理看板。其他細項可請指定同事會後補資料。</p><p class="small">「上次會議明列」是已留下的討論主題；每題內的操作細節，是為了實際建置再展開核對，不表示每一條都是與會者原話或已定案。</p><div class="filters" aria-label="篩選問題"><button data-filter="priority" aria-pressed="true">今天優先 · 6 題</button><button data-filter="all" aria-pressed="false">完整清單 · 12 題</button><button data-filter="dong" aria-pressed="false">董總相關</button><button data-filter="deng" aria-pressed="false">鄧總看板</button><button data-filter="richard" aria-pressed="false">Richard 對接</button></div><p class="small" id="filter-count"></p></div>`+questions.map((q,i)=>`<article class="q-card" id="q-${q.id}" data-q="${q.id}"><div class="q-meta"><span>${String(i+1).padStart(2,'0')}</span><span class="pill">${esc(q.basis)}</span></div><h2>${esc(q.title)}</h2><p class="q-owner">請 ${esc(q.owner)} 確認</p><div class="q-say"><div class="label">可以直接這樣問</div><p>${esc(q.ask)}</p></div><details class="q-detail"><summary>需要問清楚的細項</summary><ul>${q.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details><div class="takeaway"><strong>這題要留下的結果</strong><br>${esc(q.takeaway)}</div><a class="back-link" href="#s=${q.chapter}">回對應操作段落 →</a><details class="q-notes"><summary>記下答案／資料提供人</summary><label>討論狀態<select data-status="${q.id}"><option value="pending">待討論</option><option value="confirmed">已確認</option><option value="followup">會後補資料</option></select></label><label>答案、對接人、預計提供日<textarea data-note="${q.id}" placeholder="例如：由＿＿提供最新版權限表，預計＿＿前給。"></textarea></label></details></article>`).join('')+`<footer class="doc-end"><p>筆記只儲存在目前瀏覽器，不會上傳或同步給與會者。需要保留時可下載文字檔。</p><div class="toolbar-bottom"><button class="button" id="export-notes">下載確認筆記</button><button class="button" id="print-all">列印完整稿</button><a class="button" href="https://clutchlab-ai.github.io/kyd-erp-web/meeting-notes/2026-11-11/implementation.html" target="_blank" rel="noopener">完整改動與操作說明 ↗</a></div><p class="status-line" id="save-status" role="status"></p><p>對照 2026-11-04 會議紀錄及 2026-11-11 操作版整理。IAN 報告用。</p></footer>`;
document.querySelectorAll('[data-status]').forEach(el=>{el.value=notes[el.dataset.status]?.status||'pending';el.onchange=()=>setNote(el.dataset.status,'status',el.value)});
document.querySelectorAll('[data-note]').forEach(el=>{el.value=notes[el.dataset.note]?.text||'';el.oninput=()=>setNote(el.dataset.note,'text',el.value)});
function setNote(id,k,v){notes[id]??={};notes[id][k]=v;const ok=save('-notes',notes);$('#save-status').textContent=ok?'已儲存在此瀏覽器。':'瀏覽器無法保存，請先下載筆記。'}
function applyFont(){document.documentElement.style.setProperty('--speech',font+'px');$('#font-down').disabled=font<=20;$('#font-up').disabled=font>=29;save('-font',font)}
$('#font-down').onclick=()=>{font=Math.max(20,font-3);applyFont()};$('#font-up').onclick=()=>{font=Math.min(29,font+3);applyFont()};applyFont();
function allowed(q){return filter==='all'||filter==='priority'&&q.priority||filter==='dong'&&q.owner.includes('董總')||filter==='deng'&&q.id==='deng'||filter==='richard'&&['attendance','finance','next'].includes(q.id)}
function applyFilter(){let count=0;questions.forEach(q=>{const show=allowed(q);$('#q-'+q.id).hidden=!show;if(show)count++});document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===filter));$('#filter-count').textContent=`目前顯示 ${count} 題。未定案的題目，先記提供資料的人與日期。`}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;applyFilter();if(location.hash.startsWith('#q='))history.replaceState(null,'','#questions')});
function route(scroll=true){const hash=location.hash.slice(1),isQuestion=hash==='questions'||hash.startsWith('q=');allMode=hash==='all';$('#script-panel').hidden=isQuestion;$('#questions-panel').hidden=!isQuestion;$('#tab-script').setAttribute('aria-current',isQuestion?'false':'page');$('#tab-questions').setAttribute('aria-current',isQuestion?'page':'false');$('.footer-nav').hidden=isQuestion||allMode;$('#chapter-select').hidden=isQuestion;document.body.classList.toggle('all-mode',allMode);
if(isQuestion){if(hash.startsWith('q=')){filter='all';applyFilter();const target=$('#q-'+hash.slice(2));if(target){target.querySelector('.q-detail').open=true;if(scroll)requestAnimationFrame(()=>target.scrollIntoView({block:'start'}))}else if(scroll)window.scrollTo(0,0)}else{applyFilter();if(scroll)window.scrollTo(0,0)}}else{const id=hash.startsWith('s=')?hash.slice(2):'opening';index=Math.max(0,chapters.findIndex(c=>c.id===id));document.querySelectorAll('.script-chapter').forEach((el,i)=>el.hidden=!allMode&&i!==index);$('#chapter-select').value=chapters[index].id;$('#page-count').textContent=index===0?'會前準備':`${index} / ${chapters.length-1}`;$('#progress-fill').style.width=(index/(chapters.length-1)*100)+'%';$('#previous').disabled=index===0;$('#next').disabled=index===chapters.length-1;if(scroll)window.scrollTo(0,0);save('-last',chapters[index].id)} }
$('#chapter-select').onchange=e=>{location.hash='s='+e.target.value};$('#previous').onclick=()=>{if(index>0)location.hash='s='+chapters[index-1].id};$('#next').onclick=()=>{if(index<chapters.length-1)location.hash='s='+chapters[index+1].id};
window.addEventListener('hashchange',()=>route());window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey||!$('#questions-panel').hidden)return;if(e.key==='ArrowRight'&&index<chapters.length-1){e.preventDefault();$('#next').click()}if(e.key==='ArrowLeft'&&index>0){e.preventDefault();$('#previous').click()}});
$('#export-notes').onclick=()=>{const labels={pending:'待討論',confirmed:'已確認',followup:'會後補資料'};const text=['2026-11-12 KYD ERP｜確認筆記','',...questions.flatMap((q,i)=>[`${i+1}. ${q.title}`,`對接：${q.owner}`,`狀態：${labels[notes[q.id]?.status||'pending']}`,`需留下：${q.takeaway}`,`記錄：${notes[q.id]?.text||'尚未記錄'}`,''])].join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='2026-11-12_KYD_ERP_確認筆記.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
let beforePrint=[];window.addEventListener('beforeprint',()=>{beforePrint=Array.from(document.querySelectorAll('details')).map(d=>d.open);document.querySelectorAll('.q-card,.script-chapter').forEach(el=>el.hidden=false);document.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>{document.querySelectorAll('details').forEach((d,i)=>d.open=beforePrint[i]||false);route(false)});$('#print-all').onclick=()=>window.print();route(false);
})();
</script></body></html>
